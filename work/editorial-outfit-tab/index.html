<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>穿搭 · 编辑精选</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="app-header">
      <button type="button" aria-label="搜索穿搭">搜索穿搭灵感</button>
      <h1 class="app-header__title">穿搭</h1>
    </header>
    <nav id="channel-tabs" aria-label="穿搭场景"></nav>
    <main id="feed-screen" data-screen="feed" tabindex="-1"></main>
    <main id="detail-screen" data-screen="detail" tabindex="-1" hidden>
      <section id="story-view" data-detail-view="story"></section>
      <section id="products-view" data-detail-view="products" hidden></section>
    </main>
    <nav aria-label="商城底部导航">
      <button type="button">首页</button>
      <button type="button" aria-current="page">穿搭</button>
      <button type="button">购物车</button>
      <button type="button">我的</button>
    </nav>
    <div class="toast" id="toast" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
