<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>穿搭灵感</title>
  <style>
    :root{--text:#161823;--muted:#5C5D65;--quiet:#8A8B91;--surface:#FFFFFF;--canvas:#F5F6F9;--red:#FF003C;--s0:0;--s2:2px;--s4:4px;--s8:8px;--s12:12px;--s16:16px;--s20:20px;--s24:24px;--s32:32px;--r4:4px;--r8:8px;--r12:12px;--r16:16px;--r20:20px;--fs12:12px;--fs14:14px;--fs16:16px;--fs18:18px;--fs20:20px;--lh18:18px;--lh20:20px;--lh22:22px;--lh24:24px;--lh28:28px;--mobile-min-width:320px;--mobile-max-width:430px;--viewport-height:100vh;--detail-min-height:70vh;--hairline:1px;--touch-target:44px;--header-height:52px;--bottom-nav-height:68px;--bottom-safe-space:84px;--nav-item-height:56px;--primary-icon-size:22px;--compact-icon-size:20px;--avatar-size:24px;--active-indicator-width:20px;--hero-height:164px;--hero-title-width:240px;--strip-card-width:132px;--strip-image-height:92px;--meta-height:36px;--feed-reserve:1600px;--shadow-color:var(--quiet)}
    *{box-sizing:border-box}html{background:var(--canvas);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{margin:var(--s0);background:var(--surface);font-size:var(--fs14);line-height:var(--lh20)}button{font:inherit;color:inherit}.app{width:100%;min-width:var(--mobile-min-width);max-width:var(--mobile-max-width);margin:auto;min-height:var(--viewport-height);background:var(--surface);padding-bottom:var(--bottom-safe-space)}.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:var(--hairline) solid var(--canvas)}.titlebar{height:var(--header-height);display:flex;align-items:center;justify-content:space-between;padding:var(--s0) var(--s12)}.title{font-size:var(--fs20);line-height:var(--lh28);font-weight:700}.icon-btn{width:var(--touch-target);height:var(--touch-target);border:0;background:transparent;border-radius:var(--r20);display:grid;place-items:center}.icon{width:var(--primary-icon-size);height:var(--primary-icon-size)}.channels{display:grid;grid-template-columns:repeat(3,1fr);padding:var(--s0) var(--s8)}.channel{min-height:var(--touch-target);border:0;background:transparent;color:var(--muted);font-size:var(--fs16);line-height:var(--lh24);position:relative}.channel.active{color:var(--text);font-weight:700}.channel.active:after{content:"";position:absolute;width:var(--active-indicator-width);height:var(--s2);background:var(--red);left:50%;bottom:var(--s2);transform:translateX(-50%);border-radius:var(--r4)}.filters{display:flex;gap:var(--s8);overflow:auto;padding:var(--s8) var(--s12) var(--s12);scrollbar-width:none}.filter{white-space:nowrap;min-height:var(--touch-target);padding:var(--s0) var(--s16);border:0;border-radius:var(--r20);background:var(--canvas);color:var(--muted)}.filter.active{color:var(--surface);background:var(--text);font-weight:600}.main{padding:var(--s12)}.hero{border-radius:var(--r16);overflow:hidden;background:var(--text);color:var(--surface);position:relative;min-height:var(--hero-height)}.hero img{width:100%;height:var(--hero-height);object-fit:cover;display:block;opacity:.78}.hero-copy{position:absolute;left:var(--s16);right:var(--s16);bottom:var(--s16)}.eyebrow{font-size:var(--fs12);line-height:var(--lh18);opacity:.86}.hero h2{font-size:var(--fs20);line-height:var(--lh28);margin:var(--s4) var(--s0);max-width:var(--hero-title-width)}.hero p{font-size:var(--fs12);line-height:var(--lh18);margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;margin:var(--s24) var(--s0) var(--s12)}.section-head h2{font-size:var(--fs18);line-height:var(--lh24);margin:0}.section-head span{font-size:var(--fs12);line-height:var(--lh18);color:var(--quiet)}.strip{display:flex;gap:var(--s12);overflow:auto;margin-right:calc(var(--s12) * -1);padding-right:var(--s12);scrollbar-width:none}.strip-card{border:0;background:transparent;padding:0;min-width:var(--strip-card-width);text-align:left}.strip-card img{width:var(--strip-card-width);height:var(--strip-image-height);object-fit:cover;border-radius:var(--r12);display:block}.strip-card strong{display:block;margin-top:var(--s8);font-size:var(--fs14);line-height:var(--lh20)}.status{min-height:var(--feed-reserve);display:grid;place-items:center;color:var(--quiet)}.spinner{width:var(--compact-icon-size);height:var(--compact-icon-size);border:var(--s2) solid var(--canvas);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s16) var(--s8)}.card{min-width:0;border:0;background:var(--surface);padding:0;text-align:left;border-radius:var(--r12);overflow:hidden;box-shadow:0 var(--s2) var(--s12) var(--shadow-color)}.card:active{transform:scale(.985)}.media{position:relative;background:var(--canvas)}.media>img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.type{position:absolute;left:var(--s8);top:var(--s8);padding:var(--s4) var(--s8);border-radius:var(--r20);background:var(--surface);font-size:var(--fs12);line-height:var(--lh18)}.card-body{padding:var(--s12)}.card h3{font-size:var(--fs14);line-height:var(--lh20);margin:0 0 var(--s8);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:var(--fs12);line-height:var(--lh18);color:var(--muted);min-height:var(--meta-height)}.creator-row,.actions{display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}.avatar{width:var(--avatar-size);height:var(--avatar-size);border-radius:50%;background:var(--canvas)}.follow{min-height:var(--touch-target);border:0;background:transparent;color:var(--red);font-weight:600}.actions button{min-width:var(--touch-target);min-height:var(--touch-target);border:0;background:transparent;padding:var(--s4);display:flex;align-items:center;justify-content:center}.actions img{width:var(--compact-icon-size);height:var(--compact-icon-size)}.actions button.on{background:var(--canvas);border-radius:var(--r20)}.collection-card .media>img{aspect-ratio:1/1}.collection-mark{position:absolute;right:var(--s8);bottom:var(--s8);background:var(--text);color:var(--surface);padding:var(--s4) var(--s8);border-radius:var(--r8);font-size:var(--fs12);line-height:var(--lh18)}.outfit-card{border:var(--hairline) solid var(--canvas)}.outfit-card .media>img{aspect-ratio:4/5}.detail{padding:var(--s12);min-height:var(--detail-min-height)}.detail img{width:100%;border-radius:var(--r16);display:block}.detail h2{font-size:var(--fs20);line-height:var(--lh28)}.detail p{color:var(--muted)}.detail-top{display:flex;align-items:center;justify-content:space-between}.state-panel{padding:var(--s32) var(--s16);text-align:center}.retry{min-height:var(--touch-target);padding:0 var(--s20);border:0;border-radius:var(--r20);background:var(--red);color:var(--surface);margin-top:var(--s12)}.bottom{position:fixed;z-index:12;bottom:0;left:50%;transform:translateX(-50%);width:100%;min-width:var(--mobile-min-width);max-width:var(--mobile-max-width);height:var(--bottom-nav-height);padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:var(--hairline) solid var(--canvas)}.nav-item{min-height:var(--nav-item-height);border:0;background:transparent;color:var(--quiet);font-size:var(--fs12);line-height:var(--lh18);display:grid;place-content:center;justify-items:center;gap:var(--s2)}.nav-item img{width:var(--primary-icon-size);height:var(--primary-icon-size);opacity:.6}.nav-item.selected{color:var(--text);font-weight:700}.nav-item.selected img{opacity:1}.toast{position:fixed;left:50%;bottom:var(--bottom-safe-space);transform:translateX(-50%);background:var(--text);color:var(--surface);padding:var(--s8) var(--s16);border-radius:var(--r20);font-size:var(--fs12);line-height:var(--lh18);z-index:20}
    .open-card{display:block;width:100%;min-height:var(--touch-target);border:0;background:transparent;padding:var(--s0);text-align:left;font-weight:700}.open-card span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--fs14);line-height:var(--lh20)}.meta{margin:var(--s8) var(--s0) var(--s0)}.detail.creator-detail{background:var(--text);color:var(--surface)}.detail.creator-detail p{color:var(--canvas)}.detail.collection-detail{background:var(--canvas)}.detail.outfit-detail{background:var(--surface);border-top:var(--s4) solid var(--red)}.detail-block{padding:var(--s16);margin:var(--s12) var(--s0);border-radius:var(--r16);background:var(--surface);color:var(--text)}.detail-actions,.state-menu{display:flex;gap:var(--s8);flex-wrap:wrap}.detail-actions button,.state-menu button,.secondary-action{min-height:var(--touch-target);border:var(--hairline) solid var(--canvas);border-radius:var(--r20);background:var(--surface);padding:var(--s0) var(--s16)}.continuous-card{margin:var(--s12) var(--s0)}.continuous-card img{aspect-ratio:4/3;object-fit:cover}.image-failure{aspect-ratio:3/4;background:var(--canvas);display:grid;place-items:center;border-radius:var(--r12);color:var(--muted)}.state-menu{padding:var(--s12);background:var(--canvas)}.toast button{border:0;background:transparent;color:var(--surface);font-weight:700}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="titlebar"><span class="icon-btn" aria-hidden="true"></span><div class="title" data-proto-key="nav-title">穿搭</div><button class="icon-btn" id="state-toggle" aria-label="原型状态菜单" aria-expanded="false"><img class="icon" src="./assets/more.svg" alt=""></button></div><div id="state-menu" class="state-menu" hidden><button data-feed-state="loading">加载</button><button data-feed-state="empty">空内容</button><button data-feed-state="error">失败</button><button data-feed-state="image-failure">图片失败</button><button data-feed-state="ready">正常</button></div>
      <nav class="channels" aria-label="穿搭频道" role="tablist">
        <button class="channel active" role="tab" aria-selected="true" data-proto-key="channel-scene" data-channel="按场景">按场景</button>
        <button class="channel" role="tab" aria-selected="false" data-proto-key="channel-fit" data-channel="适合我">适合我</button>
        <button class="channel" role="tab" aria-selected="false" data-proto-key="channel-creator" data-channel="博主推荐">博主推荐</button>
      </nav>
      <div class="filters" id="filters"></div>
    </header>
    <main class="main" id="main">
      <section class="hero" data-proto-key="featured-theme"><img src="./assets/collection-1.svg" alt="抽象服装与色块构成的周末穿搭主题图"><div class="hero-copy"><div class="eyebrow">本周主题</div><h2>从城市到自然，找到轻松的穿法</h2><p>12 组多场景搭配灵感</p></div></section>
      <div class="section-head"><h2>灵感合集</h2><span>横滑查看更多</span></div>
      <section class="strip" id="strip" data-proto-key="inspiration-strip" aria-label="灵感合集"></section>
      <div class="section-head"><h2>为你推荐</h2><span id="feed-label">混合内容</span></div>
      <div id="status" class="status" hidden></div>
      <section class="feed" id="feed" data-proto-key="mixed-feed" aria-live="polite"></section>
    </main>
    <nav class="bottom" aria-label="主导航"><button class="nav-item"><img src="./assets/home.svg" alt="">首页</button><button class="nav-item selected" data-proto-key="bottom-nav-outfit"><img src="./assets/outfit.svg" alt="">穿搭</button><button class="nav-item"><img src="./assets/cart.svg" alt="">购物车</button><button class="nav-item"><img src="./assets/profile.svg" alt="">我的</button></nav>
  </div>
  <script type="module">
    import { createCatalog } from "./catalog.js";
    import { createState, selectChannel, selectFilter, openCard, returnToFeed, toggleReaction, toggleFollow, hideCard, undoHide, setFeedStatus } from "./state.js";
    const catalog=createCatalog();let state=createState();let filters=document.querySelector('#filters');let feed=document.querySelector('#feed');let strip=document.querySelector('#strip');let status=document.querySelector('#status');const main=document.querySelector('#main');let loadGeneration=0;let loadTimer=null;let restoreFrame=null;
    const icon=(name)=>`<img src="./assets/${name}.svg" alt="">`;
    function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
    function escapeAttr(value){return escapeText(value).replaceAll('"','&quot;').replaceAll("'",'&#39;')}
    function reactionClass(card,reaction){return state.reactions[card.id]?.[reaction]?'on':''}
    function feedbackActions(card){return `<div class="actions"><button class="react ${reactionClass(card,'liked')}" data-proto-key="toggle-like" data-reaction="liked" aria-label="喜欢" aria-pressed="${Boolean(state.reactions[card.id]?.liked)}">${icon('like')}</button><button class="react ${reactionClass(card,'saved')}" data-proto-key="toggle-collect" data-reaction="saved" aria-label="收藏" aria-pressed="${Boolean(state.reactions[card.id]?.saved)}">${icon('collect')}</button><button class="hide" data-proto-key="hide-card" aria-label="不感兴趣">${icon('more')}</button></div>`}
    function creatorCard(card){const following=state.followingAuthorIds.includes(card.authorId);return `<article class="card creator-card" data-card-type="creator" data-proto-key="${escapeAttr(card.id)}" data-id="${escapeAttr(card.id)}"><div class="media"><img src="${escapeAttr(card.assetPath)}" alt="${escapeAttr(card.title)}抽象穿搭插图"><span class="type">真人穿搭</span></div><div class="card-body"><button class="open-card" data-proto-key="open-card" aria-label="查看${escapeAttr(card.title)}详情"><span>${escapeText(card.title)}</span></button><p class="meta">${escapeText(card.reason)}</p></div><div class="card-body creator-row"><span class="avatar" aria-hidden="true"></span><button class="follow" data-proto-key="toggle-follow" data-follow="${escapeAttr(card.authorId)}" aria-pressed="${following}">${following?'已关注':'关注'}</button></div>${feedbackActions(card)}</article>`}
    function collectionCard(card){return `<article class="card collection-card" data-card-type="collection" data-proto-key="${escapeAttr(card.id)}" data-id="${escapeAttr(card.id)}"><div class="media"><img src="${escapeAttr(card.assetPath)}" alt="${escapeAttr(card.title)}抽象主题合集插图"><span class="type">主题合集</span><span class="collection-mark">${card.count} 组灵感</span></div><div class="card-body"><button class="open-card" data-proto-key="open-card" aria-label="查看${escapeAttr(card.title)}详情"><span>${escapeText(card.title)}</span></button><p class="meta">${escapeText(card.description)}</p></div>${feedbackActions(card)}</article>`}
    function outfitCard(card){return `<article class="card outfit-card" data-card-type="outfit" data-proto-key="${escapeAttr(card.id)}" data-id="${escapeAttr(card.id)}"><div class="media"><img src="${escapeAttr(card.assetPath)}" alt="${escapeAttr(card.title)}抽象商品搭配插图"><span class="type">商品搭配</span></div><div class="card-body"><button class="open-card" data-proto-key="open-card" aria-label="查看${escapeAttr(card.title)}详情"><span>${escapeText(card.title)}</span></button><p class="meta">${card.itemCount} 件单品 · ${escapeText(card.reason)}</p></div>${feedbackActions(card)}</article>`}
    const renderers={creator:creatorCard,collection:collectionCard,outfit:outfitCard};
    function visibleCards(){const active=state.filterByChannel[state.channel];return catalog.cards.filter(card=>card.filters[state.channel].includes(active)&&!state.hiddenCardIds.includes(card.id))}
    function renderFilters(){filters.setAttribute('role','tablist');filters.setAttribute('aria-label',`${state.channel}筛选`);filters.innerHTML=catalog.channels[state.channel].map(filter=>`<button class="filter ${filter===state.filterByChannel[state.channel]?'active':''}" role="tab" aria-selected="${filter===state.filterByChannel[state.channel]}" data-filter="${escapeAttr(filter)}">${escapeText(filter)}</button>`).join('')}
    function renderStrip(){strip.innerHTML=catalog.cards.filter(card=>card.type==='collection').map(card=>`<button class="strip-card" data-strip-id="${escapeAttr(card.id)}"><img src="${escapeAttr(card.assetPath)}" alt="${escapeAttr(card.title)}抽象主题图"><strong>${escapeText(card.title)}</strong></button>`).join('')}
    function renderFeed(){feed.dataset.feedState=state.feedStatus;if(state.feedStatus==='loading'){status.hidden=false;status.innerHTML='<span class="spinner" aria-label="内容加载中"></span>';feed.innerHTML='';return}status.hidden=true;if(state.feedStatus==='empty'){feed.innerHTML='<div class="state-panel">暂时没有匹配的灵感<br><button class="retry" data-proto-key="clear-filter" data-clear-filter>清除筛选</button></div>';return}if(state.feedStatus==='error'){feed.innerHTML='<div class="state-panel">内容加载失败<br><button class="retry" data-proto-key="retry-feed" data-retry-feed>重新加载</button></div>';return}const cards=visibleCards();feed.innerHTML=cards.length?cards.map(card=>renderers[card.type](card)).join(''):'<div class="state-panel">暂时没有匹配的灵感</div>';if(state.feedStatus==='image-failure'){feed.querySelectorAll('.media').forEach(media=>media.innerHTML='<div class="image-failure" role="img" aria-label="图片加载失败">图片暂时无法显示</div>')}}
    function cancelPendingLoad(){loadGeneration++;if(loadTimer!==null){clearTimeout(loadTimer);loadTimer=null}if(restoreFrame!==null){cancelAnimationFrame(restoreFrame);restoreFrame=null}}
    function restoreFeedScroll(){if(restoreFrame!==null)cancelAnimationFrame(restoreFrame);restoreFrame=requestAnimationFrame(()=>{restoreFrame=null;scrollTo({top:state.scrollTop,behavior:'instant'})})}
    function startLoading(){cancelPendingLoad();const generation=loadGeneration;state=setFeedStatus(state,'loading');renderFeed();loadTimer=setTimeout(()=>{if(generation!==loadGeneration)return;loadTimer=null;state=setFeedStatus(state,'ready');renderFeed();restoreFeedScroll()},260)}
    function renderShell(){main.innerHTML=`<section class="hero" data-proto-key="featured-theme"><img src="./assets/collection-1.svg" alt="抽象服装与色块构成的周末穿搭主题图"><div class="hero-copy"><div class="eyebrow">本周主题</div><h2>从城市到自然，找到轻松的穿法</h2><p>12 组多场景搭配灵感</p></div></section><div class="section-head"><h2>灵感合集</h2><span>横滑查看更多</span></div><section class="strip" id="strip" data-proto-key="inspiration-strip" aria-label="灵感合集"></section><div class="section-head"><h2>为你推荐</h2><span id="feed-label">混合内容</span></div><div id="status" class="status" hidden></div><section class="feed" id="feed" data-proto-key="mixed-feed" aria-live="polite"></section>`;filters=document.querySelector('#filters');feed=document.querySelector('#feed');strip=document.querySelector('#strip');status=document.querySelector('#status');renderFilters();renderStrip()}
    function detailTop(){return `<div class="detail-top"><button class="icon-btn" id="back" data-proto-key="back-to-feed" aria-label="返回内容流">${icon('back')}</button><span>穿搭灵感</span></div>`}
    function detailFeedback(card){const following=card.authorId&&state.followingAuthorIds.includes(card.authorId);return `<div class="detail-actions">${card.authorId?`<button data-detail-follow data-proto-key="toggle-follow" aria-pressed="${following}">${following?'已关注':'关注作者'}</button>`:''}<button data-detail-reaction="liked" data-proto-key="toggle-like" aria-pressed="${Boolean(state.reactions[card.id]?.liked)}">喜欢</button><button data-detail-reaction="saved" data-proto-key="toggle-collect" aria-pressed="${Boolean(state.reactions[card.id]?.saved)}">收藏</button><button data-detail-hide data-proto-key="hide-card">不感兴趣</button></div>`}
    function renderCreatorDetail(card){return `<section class="detail creator-detail" data-proto-key="creator-detail">${detailTop()}<img src="${escapeAttr(card.assetPath)}" alt="${escapeAttr(card.title)}抽象穿搭插图"><div class="detail-block"><div class="creator-row"><strong>灵感作者 ${escapeText(card.authorId)}</strong></div><h2>${escapeText(card.title)}</h2><p>${escapeText(card.reason||card.description)}</p><p>场景：${escapeText(card.tags[0])} · 风格：${escapeText(card.tags[1])}</p>${detailFeedback(card)}</div><div class="detail-block"><h3>相关中性单品</h3><p>轻量外搭 · 简洁上装 · 直线剪裁下装</p></div></section>`}
    function renderCollectionDetail(card){const related=catalog.cards.filter(item=>item.id!==card.id).slice(0,2);const collections=catalog.cards.filter(item=>item.type==='collection');const adjacent=collections[(collections.findIndex(item=>item.id===card.id)+1)%collections.length];return `<section class="detail collection-detail" data-proto-key="collection-detail">${detailTop()}<h2>${escapeText(card.title)}</h2><p>${escapeText(card.description||card.reason)}</p>${related.map(item=>`<article class="detail-block continuous-card" data-proto-key="collection-content-${escapeAttr(item.id)}" data-id="${escapeAttr(item.id)}"><img src="${escapeAttr(item.assetPath)}" alt="${escapeAttr(item.title)}抽象内容图"><h3>${escapeText(item.title)}</h3><p>${escapeText(item.reason||item.description)}</p></article>`).join('')}<button class="detail-block continuous-card" data-proto-key="adjacent-collection" data-adjacent-id="${escapeAttr(adjacent.id)}" aria-label="查看相邻合集${escapeAttr(adjacent.title)}"><img src="${escapeAttr(adjacent.assetPath)}" alt="${escapeAttr(adjacent.title)}抽象主题图"><h3>相邻合集推荐：${escapeText(adjacent.title)}</h3><p>${escapeText(adjacent.description)}</p></button><div class="detail-block">${detailFeedback(card)}</div></section>`}
    function renderOutfitDetail(card){return `<section class="detail outfit-detail" data-proto-key="outfit-detail">${detailTop()}<img src="${escapeAttr(card.assetPath)}" alt="${escapeAttr(card.title)}抽象穿搭插图"><h2>${escapeText(card.title)}</h2><div class="detail-block"><h3>造型思路</h3><p>${escapeText(card.reason||card.description)}。通过清晰层次保持整体轻松。</p><h3>适合谁</h3><p>${escapeText(card.filters['适合我'].join('、'))}</p><h3>中性单品清单</h3><p>基础上装 · 轮廓外套 · 日常下装 · 简洁配饰</p><button class="secondary-action" data-proto-key="outfit-commerce-feedback">查看搭配单品（原型反馈）</button>${detailFeedback(card)}</div></section>`}
    const detailRenderers={creator:renderCreatorDetail,collection:renderCollectionDetail,outfit:renderOutfitDetail};
    function bindDetail(card){document.querySelector('#back').onclick=()=>{state=returnToFeed(state);renderShell();renderFeed();restoreFeedScroll()};main.querySelector('[data-detail-follow]')?.addEventListener('click',event=>{state=toggleFollow(state,card.authorId);event.currentTarget.textContent=state.followingAuthorIds.includes(card.authorId)?'已关注':'关注作者';event.currentTarget.setAttribute('aria-pressed',String(state.followingAuthorIds.includes(card.authorId)));showToast('关注状态已更新')});main.querySelectorAll('[data-detail-reaction]').forEach(button=>button.onclick=()=>{state=toggleReaction(state,card.id,button.dataset.detailReaction);button.setAttribute('aria-pressed',String(state.reactions[card.id][button.dataset.detailReaction]));showToast('反馈已记录')});main.querySelector('[data-detail-hide]').onclick=()=>{state=hideCard(state,card.id);state=returnToFeed(state);renderShell();renderFeed();restoreFeedScroll();showToast('已减少此类内容',true)};main.querySelector('.secondary-action')?.addEventListener('click',()=>showToast('已记录查看搭配单品意向'));main.querySelector('[data-adjacent-id]')?.addEventListener('click',event=>{const nextCard=catalog.cards.find(item=>item.id===event.currentTarget.dataset.adjacentId);if(nextCard)showDetail(nextCard)})}
    function showDetail(card){cancelPendingLoad();if(state.view==='feed')state=selectChannel(state,state.channel,scrollY);state=openCard(state,card);main.innerHTML=detailRenderers[card.type](card);bindDetail(card)}
    function showToast(message,withUndo=false){document.querySelector('#toast')?.remove();const toast=document.createElement('div');toast.id='toast';toast.className='toast';toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');toast.textContent=message;if(withUndo){toast.insertAdjacentHTML('beforeend','<button data-proto-key="undo-hide"> 撤销</button>');toast.querySelector('[data-proto-key="undo-hide"]').onclick=()=>{state=undoHide(state);renderFeed();toast.remove()}}document.body.append(toast);setTimeout(()=>toast.remove(),2600)}
    const stateMenu=document.querySelector('#state-menu');const stateToggle=document.querySelector('#state-toggle');stateToggle.onclick=()=>{const open=stateMenu.hidden;stateMenu.hidden=!open;stateToggle.setAttribute('aria-expanded',String(open))};stateMenu.onclick=event=>{const button=event.target.closest('[data-feed-state]');if(!button)return;cancelPendingLoad();state=setFeedStatus(state,button.dataset.feedState);renderFeed();stateMenu.hidden=true;stateToggle.setAttribute('aria-expanded','false')};
    document.querySelector('.channels').onclick=(event)=>{const button=event.target.closest('[data-channel]');if(!button||button.dataset.channel===state.channel)return;state=selectChannel(state,button.dataset.channel,scrollY);document.querySelectorAll('.channel').forEach(item=>{const selected=item===button;item.classList.toggle('active',selected);item.setAttribute('aria-selected',String(selected))});renderFilters();startLoading()};
    document.querySelector('#app').onclick=(event)=>{if(state.view!=='feed')return;if(event.target.closest('[data-clear-filter]')){state=selectFilter(state,catalog.channels[state.channel][0]);state=setFeedStatus(state,'ready');renderFilters();renderFeed();showToast('筛选已清除');return}if(event.target.closest('[data-retry-feed]')){startLoading();return}const filterButton=event.target.closest('[data-filter]');if(filterButton){state=selectChannel(state,state.channel,scrollY);state=selectFilter(state,filterButton.dataset.filter);renderFilters();startLoading();return}const stripButton=event.target.closest('[data-strip-id]');if(stripButton){showDetail(catalog.cards.find(card=>card.id===stripButton.dataset.stripId));return}const article=event.target.closest('[data-id]');if(!article)return;const card=catalog.cards.find(item=>item.id===article.dataset.id);if(event.target.closest('.react')){const action=event.target.closest('.react');state=toggleReaction(state,card.id,action.dataset.reaction);action.classList.toggle('on');action.setAttribute('aria-pressed',String(state.reactions[card.id][action.dataset.reaction]));showToast('反馈已记录');return}if(event.target.closest('.hide')){state=hideCard(state,card.id);renderFeed();showToast('已减少此类内容',true);return}if(event.target.closest('.follow')){const action=event.target.closest('.follow');state=toggleFollow(state,card.authorId);const following=state.followingAuthorIds.includes(card.authorId);action.textContent=following?'已关注':'关注';action.setAttribute('aria-pressed',String(following));showToast('关注状态已更新');return}if(event.target.closest('.open-card'))showDetail(card)};
    renderFilters();renderStrip();startLoading();
  </script>
</body>
</html>
