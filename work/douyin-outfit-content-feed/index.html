    body[data-mode="preview"] #authoring-controls{display:none}#authoring-controls{position:fixed;z-index:30;right:var(--s12);top:var(--s12);width:var(--hero-title-width);max-height:calc(var(--viewport-height) - var(--s24));overflow:auto;padding:var(--s12);border:var(--hairline) solid var(--canvas);border-radius:var(--r12);background:var(--surface);box-shadow:0 var(--s2) var(--s12) var(--shadow-color)}#authoring-controls label{display:grid;gap:var(--s4);margin-top:var(--s8)}#authoring-controls input,#authoring-controls select,#authoring-controls textarea,#authoring-controls button{min-height:var(--touch-target);max-width:100%}.authoring-actions{display:flex;flex-wrap:wrap;gap:var(--s4)}body[data-mode="edit"] [data-proto-key]{outline:var(--s2) dashed var(--quiet);outline-offset:var(--s2);cursor:crosshair}body[data-mode="edit"] [data-proto-key].is-selected{outline-color:var(--red)}.mode-launcher{position:fixed;z-index:31;right:var(--s12);bottom:var(--bottom-safe-space)}

    .collection-card .skeleton-media{aspect-ratio:1/1}.outfit-card .skeleton-media{aspect-ratio:4/5}.status[hidden]{display:none}

<body data-mode="preview">
  <div class="app" id="app">
    <header class="top">
      <div class="titlebar"><button class="icon-btn" id="search-open" data-proto-key="search-open" aria-label="搜索穿搭灵感" aria-expanded="false"><img class="icon" src="./assets/search.svg" alt=""></button><div class="title" data-proto-key="nav-title">穿搭</div><button class="icon-btn" id="state-toggle" data-proto-key="state-toggle" aria-label="原型状态菜单" aria-expanded="false"><img class="icon" src="./assets/more.svg" alt=""></button></div><div id="search-panel" data-proto-key="search-panel" role="search" hidden><label for="search-input">搜索穿搭灵感</label><input id="search-input" data-proto-key="search-input" type="search" placeholder="输入场景或风格"><button id="search-close" data-proto-key="search-close" type="button">关闭搜索</button></div><div id="state-menu" class="state-menu" hidden><button data-proto-key="state-loading" data-feed-state="loading">加载</button><button data-proto-key="state-empty" data-feed-state="empty">空内容</button><button data-proto-key="state-error" data-feed-state="error">失败</button><button data-proto-key="state-image-failure" data-feed-state="image-failure">图片失败</button><button data-proto-key="state-ready" data-feed-state="ready">正常</button><button data-proto-key="state-action-failure" data-action-failure>下次反馈失败</button></div>
      <nav class="channels" aria-label="穿搭频道" role="tablist">
        <button class="channel active" role="tab" aria-selected="true" data-proto-key="channel-scene" data-channel="按场景">按场景</button>
        <button class="channel" role="tab" aria-selected="false" data-proto-key="channel-fit" data-channel="适合我">适合我</button>
        <button class="channel" role="tab" aria-selected="false" data-proto-key="channel-creator" data-channel="博主推荐">博主推荐</button>
      </nav>
      <div class="filters" id="filters"></div>
    </header>
    <main class="main" id="main">
      <section class="hero" data-proto-key="featured-theme"><img src="./assets/collection-1.svg" alt="抽象服装与色块构成的周末穿搭主题图"><div class="hero-copy"><div class="eyebrow" data-proto-key="featured-eyebrow">本周主题</div><h2 data-proto-key="featured-title">从城市到自然，找到轻松的穿法</h2><p data-proto-key="featured-summary">12 组多场景搭配灵感</p><button data-proto-key="featured-open" data-featured-id="collection-1">查看合集</button></div></section>
      <div class="section-head"><h2 data-proto-key="section-inspiration-title">灵感合集</h2><span data-proto-key="section-inspiration-more">横滑查看更多</span></div>
      <section class="strip" id="strip" data-proto-key="inspiration-strip" aria-label="灵感合集"></section>
      <div class="section-head"><h2 data-proto-key="section-recommendation-title">为你推荐</h2><span id="feed-label" data-proto-key="feed-label">混合内容</span></div>
      <section class="feed" id="feed" data-proto-key="mixed-feed" aria-live="polite"></section>
      <div id="status" class="status" hidden></div>
    </main>
    <nav class="bottom" aria-label="主导航"><button class="nav-item" data-proto-key="bottom-nav-home" disabled aria-label="首页，当前原型暂未开放"><img src="./assets/home.svg" alt=""><span data-edit-text>首页</span></button><button class="nav-item selected" data-proto-key="bottom-nav-outfit" aria-current="page"><img src="./assets/outfit.svg" alt=""><span data-edit-text>穿搭</span></button><button class="nav-item" data-proto-key="bottom-nav-cart" disabled aria-label="购物车，当前原型暂未开放"><img src="./assets/cart.svg" alt=""><span data-edit-text>购物车</span></button><button class="nav-item" data-proto-key="bottom-nav-profile" disabled aria-label="我的，当前原型暂未开放"><img src="./assets/profile.svg" alt=""><span data-edit-text>我的</span></button></nav>
  </div>
  <button class="mode-launcher" id="mode-edit" type="button">编辑原型</button>
  <aside id="authoring-controls" aria-label="原型编辑器" hidden>
    <div class="authoring-actions"><button id="mode-preview" type="button">预览</button><button id="undo-edit" type="button">撤销</button><button id="redo-edit" type="button">重做</button></div>
    <p>已选：<strong id="selected-key">未选择</strong></p>
    <label>文字<input id="edit-text" type="text"></label><label>文字颜色<input id="edit-color" type="color" value="#161823"></label><label>本地图片路径<input id="edit-image" type="text" placeholder="./assets/outfit-1.svg"></label>
    <label>水平偏移（-48 至 48 px，留空重置）<input id="edit-offset-x" type="number" min="-48" max="48" step="1"></label><label>垂直偏移（-48 至 48 px，留空重置）<input id="edit-offset-y" type="number" min="-48" max="48" step="1"></label><label>宽度（40 至 430 px，留空自适应）<input id="edit-width" type="number" min="40" max="430" step="1"></label><label>高度（24 至 900 px，留空自适应）<input id="edit-height" type="number" min="24" max="900" step="1"></label>
    <label><input id="edit-hidden" type="checkbox">隐藏元素</label><label><input id="edit-disabled" type="checkbox">禁用操作</label><label>预览跳转<select id="edit-target"><option value="">保持原操作</option><option value="feed">内容流</option><option value="creator-detail">真人穿搭详情</option><option value="collection-detail">主题合集详情</option><option value="outfit-detail">商品搭配详情</option></select></label>
    <div class="authoring-actions"><button id="apply-edit" type="button">应用修改</button><button id="export-patches" type="button">导出修改</button></div>
    <label>Agent 修改要求<textarea id="agent-request" rows="3"></textarea></label><div class="authoring-actions"><button id="agent-submit" type="button">保存评论</button><button id="export-comments" type="button">导出评论</button></div><p id="agent-status" role="status"></p>
  </aside>
  <script type="module">
    import { createCatalog } from "./catalog.js";
    import { createState, selectChannel, selectFilter, openCard, returnToFeed, toggleReaction, toggleFollow, hideCard, undoHide, setFeedStatus } from "./state.js";
    const catalog=createCatalog();let state=createState();let filters=document.querySelector('#filters');let feed=document.querySelector('#feed');let strip=document.querySelector('#strip');let status=document.querySelector('#status');let feedLabel=document.querySelector('#feed-label');const main=document.querySelector('#main');const feedShellMarkup=main.innerHTML;let loadGeneration=0;let loadTimer=null;let restoreFrame=null;let hasRenderedFeed=false;let failNextAction=false;let searchQuery='';
    const icon=(name)=>`<img src="./assets/${name}.svg" alt="">`;
    function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
    function escapeAttr(value){return escapeText(value).replaceAll('"','&quot;').replaceAll("'",'&#39;')}
    function reactionClass(card,reaction){return state.reactions[card.id]?.[reaction]?'on':''}
    function feedbackActions(card){return `<div class="actions"><button class="react ${reactionClass(card,'liked')}" data-proto-key="${escapeAttr(card.id)}-like" data-reaction="liked" aria-label="喜欢" aria-pressed="${Boolean(state.reactions[card.id]?.liked)}">${icon('like')}</button><button class="react ${reactionClass(card,'saved')}" data-proto-key="${escapeAttr(card.id)}-collect" data-reaction="saved" aria-label="收藏" aria-pressed="${Boolean(state.reactions[card.id]?.saved)}">${icon('collect')}</button><button class="hide" data-proto-key="${escapeAttr(card.id)}-hide" aria-label="不感兴趣">${icon('more')}</button></div>`}
    function creatorCard(card){const following=state.followingAuthorIds.includes(card.authorId);return `<article class="card creator-card" data-card-type="creator" data-proto-key="${escapeAttr(card.id)}" data-id="${escapeAttr(card.id)}"><div class="media"><img src="${escapeAttr(card.assetPath)}" alt="${escapeAttr(card.title)}抽象穿搭插图"><span class="type">真人穿搭</span></div><div class="card-body"><button class="open-card" data-proto-key="${escapeAttr(card.id)}-open" aria-label="查看${escapeAttr(card.title)}详情"><span data-edit-text>${escapeText(card.title)}</span></button><p class="meta">${escapeText(card.reason)}</p><p class="meta">场景：${escapeText(card.tags[0])} · 风格：${escapeText(card.tags[1])}</p></div><div class="card-body creator-row"><span>${escapeText(card.authorName)}</span><button class="follow" data-proto-key="${escapeAttr(card.id)}-follow" data-follow="${escapeAttr(card.authorId)}" aria-pressed="${following}">${following?'已关注':'关注'}</button></div>${feedbackActions(card)}</article>`}
    function collectionCard(card){return `<article class="card collection-card" data-card-type="collection" data-proto-key="${escapeAttr(card.id)}" data-id="${escapeAttr(card.id)}"><div class="media"><img src="${escapeAttr(card.assetPath)}" alt="${escapeAttr(card.title)}抽象主题合集插图"><span class="type">主题合集</span><span class="collection-mark">${card.count} 组灵感</span></div><div class="card-body"><button class="open-card" data-proto-key="${escapeAttr(card.id)}-open" aria-label="查看${escapeAttr(card.title)}详情"><span data-edit-text>${escapeText(card.title)}</span></button><p class="meta">${escapeText(card.description)}</p></div>${feedbackActions(card)}</article>`}
    function outfitCard(card){return `<article class="card outfit-card" data-card-type="outfit" data-proto-key="${escapeAttr(card.id)}" data-id="${escapeAttr(card.id)}"><div class="media"><img src="${escapeAttr(card.assetPath)}" alt="${escapeAttr(card.title)}抽象商品搭配插图"><span class="type">商品搭配</span></div><div class="card-body"><button class="open-card" data-proto-key="${escapeAttr(card.id)}-open" aria-label="查看${escapeAttr(card.title)}详情"><span data-edit-text>${escapeText(card.title)}</span></button><p class="meta">${card.itemCount} 件单品 · ${escapeText(card.reason)}</p></div>${feedbackActions(card)}</article>`}
    const renderers={creator:creatorCard,collection:collectionCard,outfit:outfitCard};
    function matchesSearch(card){if(!searchQuery)return true;const searchable=[card.title,card.reason,card.description,card.authorName,...card.tags].filter(Boolean).join(' ').toLocaleLowerCase();return searchable.includes(searchQuery.toLocaleLowerCase())}

    document.addEventListener('click',event=>{const element=event.target.closest('[data-proto-key]');if(!element)return;if(prototypeMode==='edit'){event.preventDefault();event.stopImmediatePropagation();selectEditable(element);return}if(keyedPath(event.target).some(node=>editablePatches[node.dataset.protoKey]?.disabled)){event.preventDefault();event.stopImmediatePropagation();return}const target=isInteractiveEditable(element)?element.dataset.editNavigation:'';if(target){event.preventDefault();event.stopImmediatePropagation();navigateEditable(target)}},true);
    let editableObserver=new MutationObserver(()=>queueMicrotask(bindEditableRegions));editableObserver.observe(document.querySelector('#app'),{childList:true,subtree:true});setPrototypeMode('preview');renderFilters();renderStrip();startLoading();bindEditableRegions();
  </script>
</body>
