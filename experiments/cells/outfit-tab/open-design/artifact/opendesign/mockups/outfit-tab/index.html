<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>穿搭灵感 · React 原型</title>
  <style>
    :root{--ink:#101724;--muted:#718098;--soft:#f4f6f8;--line:#e9edf2;--lime:#c8ff72;--red:#ff2d55;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#dfe2e5;color:var(--ink);font-family:"PingFang SC","Noto Sans SC",sans-serif}.shell{width:min(430px,100vw);height:100vh;margin:auto;background:#fff;overflow:hidden;position:relative;box-shadow:0 20px 70px #20293833}.status{height:30px;padding:8px 20px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.top{padding:10px 14px 8px;background:#fff}.primary{height:44px;display:flex;align-items:center;justify-content:space-between}.primary-group{display:flex;gap:18px}.plain,.icon{border:0;background:transparent;min-height:44px;min-width:44px;cursor:pointer;color:var(--muted);font-weight:700}.plain.active{color:var(--ink);font-size:20px}.tabs{display:flex;gap:8px;overflow:auto;padding-top:7px;scrollbar-width:none}.tab,.round,.cta{border:0;border-radius:999px;min-height:44px;padding:0 15px;cursor:pointer;font-weight:700}.tab{background:#f2f4f7;color:#66758d;white-space:nowrap}.tab.active{background:var(--ink);color:#fff}.content{height:calc(100vh - 180px);overflow:auto;background:var(--soft);padding:12px 12px 100px}.hero{background:#fff;border-radius:18px;overflow:hidden;cursor:pointer;outline-offset:3px}.hero:hover{transform:translateY(-1px)}.photo{height:340px;position:relative;background:#242b36 url("assets/look.png") center 22%/cover no-repeat}.reason{position:absolute;left:14px;right:14px;bottom:14px;background:#fffffff0;padding:14px;border-radius:14px}.reason strong{display:block;font-size:18px;margin-top:4px}.chips{display:flex;gap:6px;margin-top:8px}.chip,.hl{background:var(--lime);padding:3px 7px;border-radius:5px;font-size:12px;font-weight:700}.hero-foot{padding:14px}.hero-foot h2{font-size:18px;margin:0 0 7px}.why,.muted{color:var(--muted);line-height:1.5}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.round{background:#fff;border:1px solid #dce2e9}.cta{background:var(--ink);color:#fff}.secondary{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border:0;background:#fff;border-radius:16px;padding:14px;text-align:left;min-height:108px;cursor:pointer}.mini b{display:block;margin:9px 0}.detail{height:calc(100vh - 30px);overflow:auto;background:#fff;padding-bottom:105px}.detail-head{height:400px;background:#242b36 url("assets/look.png") center 25%/cover no-repeat;position:relative}.back{margin:12px;border:0;background:#101724dd;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer}.tagline{position:absolute;left:16px;right:16px;bottom:16px;background:#101724df;color:#fff;border-radius:14px;padding:13px}.section{padding:20px 18px;border-bottom:8px solid var(--soft)}.section h2{margin:0 0 12px;font-size:21px}.panel{background:var(--soft);border-radius:14px;padding:15px;line-height:1.6;color:#536176}.swatches{display:flex;gap:10px;margin-bottom:10px}.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d8dde4}.product{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;margin-top:10px}.thumb{width:54px;height:64px;border-radius:9px;background:#213349}.ptext{flex:1}.ptext b{display:block}.airow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ai{border:0;min-height:112px;border-radius:16px;text-align:left;padding:15px;background:var(--ink);color:#fff;cursor:pointer}.ai.alt{background:var(--lime);color:#1e2a13}.ai:disabled{opacity:.45;cursor:not-allowed}.ai span{display:block;margin-top:18px;font-weight:700}.bottom{position:absolute;z-index:8;bottom:0;left:0;right:0;background:#fffffff0;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px 16px}.nav{border:0;background:transparent;color:var(--muted);min-width:62px;min-height:44px;cursor:pointer;font-size:12px}.nav.active{color:var(--red);font-weight:700}.overlay{position:absolute;inset:0;background:#10172470;z-index:20;display:flex;align-items:flex-end}.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:14px 18px 28px}.grab{width:38px;height:4px;border-radius:4px;background:#d5d9df;margin:0 auto 20px}.sheet-actions{display:flex;gap:10px;margin-top:18px}.sheet-actions button{flex:1}.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:#101724;color:#fff;padding:11px 16px;border-radius:999px;z-index:30;white-space:nowrap}.spinner{width:34px;height:34px;border:4px solid #e3e7eb;border-top-color:var(--ink);border-radius:50%;margin:0 auto 15px;animation:spin .7s linear infinite}.look-result{height:230px;border-radius:17px;background:url("assets/look.png") center 25%/cover;margin:14px 0}.empty{text-align:center;background:#fff;padding:40px 20px;border-radius:18px}.notice{background:#fff5dc;border:1px solid #f1d895;padding:12px;border-radius:12px;margin:10px 0}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect,useState}=React;
const categories=["博主精选","场景适配","身型适配","日常","通勤","出游"];
const categoryCopy={"博主精选":"博主实穿 3 次","场景适配":"通勤不刻板","身型适配":"高个子拉长比例","日常":"日常松弛不随便","通勤":"轻正式也有记忆点","出游":"耐走又上镜"};
const storage={get:(k,f)=>localStorage.getItem(k)||f,set:(k,v)=>localStorage.setItem(k,v)};

function Header({category,onCategory,onNotice}){
  return <header className="top"><div className="primary">
    <button className="icon" aria-label="菜单" onClick={()=>onNotice("频道菜单已展开：穿搭 / 直播 / 推荐")}>☰</button>
    <div className="primary-group">{["穿搭","直播","推荐"].map(x=><button key={x} className={'plain '+(x==='穿搭'?'active':'')} onClick={()=>onNotice(x==='穿搭'?'已在穿搭频道':`${x}频道为演示预览`)}>{x}</button>)}</div>
    <button className="icon" aria-label="搜索" onClick={()=>onNotice("搜索已打开：试试“梨形 通勤”")}>⌕</button>
  </div><div className="tabs">{categories.map(x=><button data-testid={`category-${x}`} key={x} className={'tab '+(category===x?'active':'')} onClick={()=>onCategory(x)}>{x}</button>)}</div></header>
}

function Feed({category,onOpen,onNotice}){
  const [removed,setRemoved]=useState(false);
  if(removed)return <div className="content"><div className="empty"><h2>已减少此类推荐</h2><p>你可以恢复，或切换其他分类。</p><button className="cta" onClick={()=>setRemoved(false)}>恢复推荐</button></div></div>;
  const activate=e=>{if(e.type==='click'||e.key==='Enter'){e.preventDefault();onOpen()}};
  return <div className="content"><article data-testid="reason-card" className="hero" tabIndex="0" role="button" aria-label="打开理由型穿搭卡" onClick={activate} onKeyDown={activate}>
    <div className="photo"><div className="reason"><small>{categoryCopy[category]}</small><strong>牛仔短外套 + 酒红内搭</strong><div className="chips"><span className="chip">{category}</span><span className="chip">显高不压身</span></div></div></div>
    <div className="hero-foot"><h2>今天这样穿，比例利落又有复古感</h2><div className="why">适合轻通勤与周末约会，整套有同款与平替。</div><div className="actions"><button className="round" onClick={e=>{e.stopPropagation();onNotice("已强化相似推荐")}}>♡ 喜欢</button><button className="round" onClick={e=>{e.stopPropagation();setRemoved(true)}}>减少</button><button className="cta" onClick={e=>{e.stopPropagation();onOpen()}}>看为什么适合我</button></div></div>
  </article><div className="secondary"><button className="mini" onClick={()=>onNotice("已切换到西装长裙相似卡")}><span className="chip">同场景</span><b>西装 + 长裙</b><small>办公室友好</small></button><button className="mini" onClick={()=>onNotice("已切换到短上衣相似卡")}><span className="chip">相似身型</span><b>短上衣 + 阔腿裤</b><small>拉长腿线</small></button></div></div>
}

function ProductSheet({kind,onClose,onNotice}){const alt=kind==='alt';return <Sheet onClose={onClose}><small>{alt?'相似平替 · 库存充足':'官方同款 · 7 天无理由'}</small><h2>{alt?'水洗短款丹宁外套':'复古牛仔短外套'}</h2><h1>{alt?'¥199':'¥358'}</h1><p>深蓝水洗 · 丹宁棉 {alt?'98%':'100%'} · XS–XL</p><div className="panel">{alt?'比同款省 ¥159，短款比例一致，面料更柔软。':'博主同款版型，肩线挺括；无弹面料建议按尺码表选购。'}</div><div className="sheet-actions"><button className="round" onClick={onClose}>继续逛</button><button className="cta" onClick={()=>{onNotice("已加入购物车");onClose()}}>加入购物车</button></div></Sheet>}

function AiSheet({mode,onClose,onNotice}){
  const [phase,setPhase]=useState('loading');
  useEffect(()=>{const t=setTimeout(()=>setPhase(mode==='style'?'failed':'result'),700);return()=>clearTimeout(t)},[mode]);
  if(phase==='loading')return <Sheet onClose={onClose}><div style={{textAlign:'center'}}><div className="spinner"></div><h2>{mode==='try'?'正在准备试穿间':'正在生成同款延展'}</h2><p>任务进行中，操作暂时禁用</p><button className="cta" disabled>处理中…</button></div></Sheet>;
  if(phase==='failed')return <Sheet onClose={onClose}><h2>这次生成没有完成</h2><div className="notice">网络波动导致搭配任务失败，当前商品与选择已保留。</div><div className="sheet-actions"><button className="round" onClick={onClose}>返回详情</button><button data-testid="ai-retry" className="cta" onClick={()=>setPhase('loading')}>重试生成</button></div></Sheet>;
  return <Sheet onClose={onClose}><small>AI 试穿入口已打开</small><h2>上传正面全身照</h2><div className="look-result"></div><div className="panel">支持相册或拍照；照片仅用于本次试穿演示。</div><div className="sheet-actions"><button className="round" onClick={onClose}>返回详情</button><button className="cta" onClick={()=>onNotice("相册选择器已打开（演示）")}>从相册选择</button></div></Sheet>;
}

function Sheet({children,onClose}){return <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}><div className="sheet" role="dialog" aria-modal="true"><div className="grab"></div>{children}</div></div>}

function Detail({onBack,onNotice}){
 const [sheet,setSheet]=useState(null);
 return <div className="detail"><div className="detail-head"><button className="back" aria-label="返回" onClick={onBack}>‹</button><div className="tagline"><b>复古牛仔外套叠穿酒红内搭</b><br/><small>通勤显高 · 一套可买 · 博主实穿</small></div></div>
  <section className="section"><h2>为什么适合你</h2><div className="panel">短外套把腰线提高，低腰微喇裤修饰胯部，适合 <span className="hl">高个子</span>、轻通勤和喜欢复古红风的人。</div></section>
  <section className="section"><h2>配色公式</h2><div className="panel"><div className="swatches"><i className="swatch" style={{background:'#101724'}}></i><i className="swatch" style={{background:'#7b0d28'}}></i><i className="swatch" style={{background:'#5a3929'}}></i></div><span className="hl">深牛仔</span> 压轮廓 + <span className="hl">酒红</span> 提气色 + 棕色托特增强复古感。</div></section>
  <section className="section"><h2>避雷与尺码</h2><div className="panel">梨形身材避免外套卡在胯最宽处；裤长建议盖住鞋面 1–2 cm。丹宁无弹，介于两码时选大一码。</div></section>
  <section className="section"><h2>整套商品</h2>{[['same','复古牛仔短外套','¥358'],['alt','水洗短款丹宁外套','¥199']].map(p=><div className="product" key={p[0]}><div className="thumb"></div><div className="ptext"><small>{p[0]==='alt'?'相似版型 · 价格更轻':'买家说 · 版型挺括'}</small><b>{p[1]}</b><strong>{p[2]}</strong></div><button className="round" onClick={()=>setSheet(p[0])}>{p[0]==='alt'?'看平替':'购买'}</button></div>)}</section>
  <section className="section"><h2>AI 继续帮你搭</h2><div className="airow"><button className="ai" onClick={()=>setSheet('style')}><small>保留当前外套</small><span>生成同款延展 →</span></button><button className="ai alt" onClick={()=>setSheet('try')}><small>看看自己上身</small><span>进入 AI 试穿 →</span></button></div></section>
  {(sheet==='same'||sheet==='alt')&&<ProductSheet kind={sheet} onClose={()=>setSheet(null)} onNotice={onNotice}/>} {(sheet==='try'||sheet==='style')&&<AiSheet mode={sheet} onClose={()=>setSheet(null)} onNotice={onNotice}/>}</div>
}

function BottomNav({active,onNotice}){return <nav className="bottom">{["首页","发现","消息","购物车","我的"].map(x=><button key={x} className={'nav '+(active===x?'active':'')} onClick={()=>onNotice(x==='发现'?'已在发现页':`${x}页已打开（演示状态）`)}>{x}</button>)}</nav>}

function App(){
 const [category,setCategory]=useState(()=>storage.get('outfit.category','博主精选'));const [screen,setScreen]=useState(()=>storage.get('outfit.screen','feed'));const [toast,setToast]=useState('');
 useEffect(()=>storage.set('outfit.category',category),[category]);useEffect(()=>storage.set('outfit.screen',screen),[screen]);useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),1300);return()=>clearTimeout(t)},[toast]);
 const notice=t=>setToast(t);return <main className="shell" aria-label="穿搭原型"><div className="status"><span>9:41</span><span>5G · 92%</span></div>{screen==='feed'?<><Header category={category} onCategory={x=>{setCategory(x);notice(`已切换到${x}`)}} onNotice={notice}/><Feed category={category} onOpen={()=>setScreen('detail')} onNotice={notice}/></>:<Detail onBack={()=>setScreen('feed')} onNotice={notice}/>}<BottomNav active="发现" onNotice={notice}/>{toast&&<div className="toast" role="status">{toast}</div>}</main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
