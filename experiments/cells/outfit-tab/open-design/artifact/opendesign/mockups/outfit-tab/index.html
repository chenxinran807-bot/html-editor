<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>穿搭灵感</title>
  <style>
    :root{--ink:#101724;--muted:#718098;--soft:#f4f6f8;--line:#e9edf2;--lime:#c8ff72;--red:#ff2d55;--white:#fff;--r:18px}
    *{box-sizing:border-box} body{margin:0;background:#dfe2e5;color:var(--ink);font-family:"PingFang SC","Noto Sans SC",sans-serif}.shell{width:min(430px,100vw);height:100vh;margin:auto;background:#fff;overflow:hidden;position:relative;box-shadow:0 20px 70px #20293833}.status{height:30px;padding:8px 20px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.top{padding:11px 16px 8px;background:#fff;position:relative;z-index:4}.primary{height:44px;display:flex;align-items:center;justify-content:space-between}.primary b{font-size:21px}.primary .mid{display:flex;gap:24px}.primary .muted{color:var(--muted)}button{font:inherit}.icon{border:0;background:transparent;min-width:44px;min-height:44px;cursor:pointer}.tabs{display:flex;gap:10px;overflow:auto;padding-top:7px;scrollbar-width:none}.tab{border:0;background:#f2f4f7;color:#66758d;border-radius:999px;padding:10px 16px;white-space:nowrap;font-weight:700;cursor:pointer;min-height:44px}.tab.active{background:var(--ink);color:#fff}.content{height:calc(100vh - 181px);overflow:auto;background:var(--soft);padding:12px 12px 100px;scroll-behavior:smooth}.hero{background:#fff;border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.18s transform}.hero:hover{transform:translateY(-2px)}.photo{height:356px;position:relative;background:#242b36 url("assets/look.png") center 22%/cover no-repeat}.reason{position:absolute;left:14px;right:14px;bottom:14px;background:#ffffffee;backdrop-filter:blur(8px);padding:14px;border-radius:14px}.reason small{color:#66758d}.reason strong{display:block;font-size:18px;margin-top:4px}.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.chip{background:var(--lime);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:700}.hero-foot{padding:14px}.hero-foot h2{font-size:18px;margin:0 0 7px}.why{color:#5e6c80;font-size:14px;line-height:1.5}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.round{border:1px solid #dce2e9;background:#fff;border-radius:999px;min-height:44px;padding:0 15px;cursor:pointer;font-weight:700}.round:hover,.cta:hover{filter:brightness(.96)}.cta{background:var(--ink);color:#fff;border:0;border-radius:999px;min-height:44px;padding:0 18px;cursor:pointer;font-weight:700}.secondary{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border:0;background:#fff;border-radius:16px;padding:14px;text-align:left;min-height:108px;cursor:pointer}.mini b{display:block;margin:9px 0 4px}.empty{background:#fff;border-radius:18px;padding:38px 24px;text-align:center}.detail{display:none;height:calc(100vh - 30px);overflow:auto;background:#fff;padding-bottom:100px}.detail.open{display:block}.detail-head{height:410px;background:#242b36 url("assets/look.png") center 25%/cover no-repeat;position:relative}.back{position:sticky;top:10px;z-index:7;margin:12px;border:0;background:#101724db;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer}.tagline{position:absolute;left:16px;right:16px;bottom:16px;background:#101724db;color:#fff;border-radius:14px;padding:13px}.section{padding:20px 18px;border-bottom:8px solid var(--soft)}.section h2{margin:0 0 12px;font-size:21px}.panel{background:var(--soft);border-radius:14px;padding:15px;line-height:1.6;color:#536176}.hl{background:var(--lime);color:#263219;font-weight:700;padding:1px 4px;border-radius:4px}.swatches{display:flex;gap:10px;margin-bottom:10px}.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d8dde4}.products{display:grid;gap:10px}.product{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px}.thumb{width:54px;height:64px;border-radius:9px;background:linear-gradient(150deg,#17283e,#5c371f)}.ptext{flex:1}.ptext small{color:var(--muted)}.ptext b{display:block}.airow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ai{border:0;min-height:112px;border-radius:16px;text-align:left;padding:15px;background:var(--ink);color:#fff;cursor:pointer}.ai.alt{background:var(--lime);color:#1e2a13}.ai span{display:block;margin-top:18px;font-weight:700}.bottom{position:absolute;z-index:8;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px 16px;backdrop-filter:blur(14px)}.nav{border:0;background:transparent;color:var(--muted);min-width:62px;min-height:44px;cursor:pointer;font-size:12px}.nav.active{color:var(--red);font-weight:700}.sheet-wrap{position:absolute;inset:0;background:#10172470;z-index:20;display:none;align-items:flex-end}.sheet-wrap.show{display:flex}.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:12px 18px 28px;animation:up .25s ease}.grab{width:38px;height:4px;border-radius:4px;background:#d5d9df;margin:0 auto 20px}.sheet h2{margin:0 0 8px}.sheet .big{font-size:28px;font-weight:800}.sheet-actions{display:flex;gap:10px;margin-top:18px}.sheet-actions button{flex:1}.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:#101724;color:#fff;padding:11px 16px;border-radius:999px;z-index:30;display:none;white-space:nowrap}.toast.show{display:block}.loading{display:none;text-align:center;padding:38px}.loading.show{display:block}.spinner{width:34px;height:34px;border:4px solid #e3e7eb;border-top-color:var(--ink);border-radius:50%;margin:0 auto 15px;animation:spin .7s linear infinite}.result{display:none}.result.show{display:block}.look-result{height:230px;border-radius:17px;background:url("assets/look.png") center 25%/cover;margin:14px 0}.reset{position:absolute;right:12px;top:34px;z-index:9;font-size:11px;border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 9px;cursor:pointer}@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<main class="shell" aria-label="穿搭原型">
  <div class="status"><span>9:41</span><span>5G · 92%</span></div>
  <button class="reset" id="reset">重置演示</button>
  <section id="feedScreen">
    <header class="top"><div class="primary"><button class="icon" aria-label="菜单">☰</button><div class="mid"><b>穿搭</b><b class="muted">直播</b><b class="muted">推荐</b></div><button class="icon" aria-label="搜索">⌕</button></div><div class="tabs" id="tabs"></div></header>
    <div class="content" id="feed"></div>
  </section>
  <section class="detail" id="detailScreen" aria-label="穿搭详情">
    <div class="detail-head"><button class="back" id="back" aria-label="返回">‹</button><div class="tagline"><b>复古牛仔外套叠穿酒红内搭</b><br><small>通勤显高 · 一套可买 · 博主实穿</small></div></div>
    <div class="section"><h2>为什么适合你</h2><div class="panel">短外套把腰线提高，低腰微喇裤修饰胯部，适合 <span class="hl">高个子</span>、轻通勤和喜欢 <span class="hl">复古红风</span> 的人。</div></div>
    <div class="section"><h2>配色公式</h2><div class="panel"><div class="swatches"><i class="swatch" style="background:#101724"></i><i class="swatch" style="background:#7b0d28"></i><i class="swatch" style="background:#5a3929"></i></div><span class="hl">深牛仔</span> 压住轮廓 + <span class="hl">酒红</span> 提气色 + 棕色皮质托特增强复古感。</div></div>
    <div class="section"><h2>避雷与尺码</h2><div class="panel">梨形身材避免外套卡在胯最宽处；裤长建议盖住鞋面 1–2 cm。丹宁面料无弹，腰围介于两码时选大一码。</div></div>
    <div class="section"><h2>整套商品</h2><div class="products"><div class="product"><div class="thumb"></div><div class="ptext"><small>买家说 · 版型挺括</small><b>复古牛仔短外套</b><strong>¥358</strong></div><button class="round product-open" data-kind="same">购买</button></div><div class="product"><div class="thumb" style="filter:saturate(.55)"></div><div class="ptext"><small>相似版型 · 价格更轻</small><b>水洗短款丹宁外套</b><strong>¥199</strong></div><button class="round product-open" data-kind="alt">看平替</button></div></div></div>
    <div class="section"><h2>AI 继续帮你搭</h2><div class="airow"><button class="ai" data-ai="style"><small>保留当前外套</small><span>生成同款延展 →</span></button><button class="ai alt" data-ai="try"><small>看看自己上身</small><span>进入 AI 试穿 →</span></button></div></div>
  </section>
  <nav class="bottom"><button class="nav">首页</button><button class="nav active">发现</button><button class="nav">消息</button><button class="nav">购物车</button><button class="nav">我的</button></nav>
  <div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>
  <div class="toast" id="toast"></div>
</main>
<script>
  const categories=["博主精选","场景适配","身型适配","日常","通勤","出游"];
  const copy={"博主精选":["博主实穿 3 次","显高不压身","牛仔短外套 + 酒红内搭"],"场景适配":["通勤不刻板","室内外好穿脱","牛仔短外套 + 微喇裤"],"身型适配":["高个子拉长比例","短上衣提腰线","短外套 + 微喇长裤"],"日常":["日常松弛不随便","一套 3 色不杂乱","丹宁 + 针织 + 托特"],"通勤":["轻正式也有记忆点","酒红更提气色","短外套 + 长裤"],"出游":["耐走又上镜","层次清楚不臃肿","短外套 + 舒适鞋"]};
  const state={category:localStorage.getItem("outfit.category")||"博主精选",screen:localStorage.getItem("outfit.screen")||"feed",removed:false};
  const tabs=document.getElementById("tabs"),feed=document.getElementById("feed"),detail=document.getElementById("detailScreen"),feedScreen=document.getElementById("feedScreen"),toast=document.getElementById("toast"),sheetWrap=document.getElementById("sheetWrap"),sheetBody=document.getElementById("sheetBody");
  function renderTabs(){tabs.innerHTML=categories.map(x=>`<button class="tab ${x===state.category?'active':''}" data-cat="${x}">${x}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;state.removed=false;localStorage.setItem('outfit.category',state.category);renderTabs();renderFeed();pop(`已切换到${state.category}`)})}
  function renderFeed(){if(state.removed){feed.innerHTML=`<div class="empty"><h2>已减少此类推荐</h2><p>换个分类，或恢复这套穿搭继续查看。</p><button class="cta" id="restore">恢复推荐</button></div>`;document.getElementById('restore').onclick=()=>{state.removed=false;renderFeed()};return}const c=copy[state.category];feed.innerHTML=`<article class="hero" id="reasonCard" tabindex="0"><div class="photo"><div class="reason"><small>${c[0]}</small><strong>${c[2]}</strong><div class="chips"><span class="chip">${state.category}</span><span class="chip">${c[1]}</span></div></div></div><div class="hero-foot"><h2>今天这样穿，比例利落又有复古感</h2><div class="why">适合轻通勤与周末约会，短外套提腰线，整套有同款与平替可直接查看。</div><div class="actions"><div><button class="round" id="like">♡ 喜欢</button> <button class="round" id="dislike">减少</button></div><button class="cta" id="openDetail">看为什么适合我</button></div></div></article><div class="secondary"><button class="mini"><span class="chip">同场景</span><b>西装 + 长裙</b><small>办公室友好</small></button><button class="mini"><span class="chip">相似身型</span><b>短上衣 + 阔腿裤</b><small>拉长腿线</small></button></div>`;document.getElementById('openDetail').onclick=openDetail;document.getElementById('reasonCard').ondblclick=openDetail;document.getElementById('like').onclick=e=>{e.stopPropagation();pop('已强化相似推荐')};document.getElementById('dislike').onclick=e=>{e.stopPropagation();state.removed=true;renderFeed();pop('已减少此类推荐')}}
  function openDetail(){state.screen='detail';localStorage.setItem('outfit.screen','detail');feedScreen.style.display='none';detail.classList.add('open');detail.scrollTop=0}
  function closeDetail(){state.screen='feed';localStorage.setItem('outfit.screen','feed');detail.classList.remove('open');feedScreen.style.display='block'}
  function pop(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
  function sheet(html){sheetBody.innerHTML=html;sheetWrap.classList.add('show')}
  document.getElementById('back').onclick=closeDetail;sheetWrap.onclick=e=>{if(e.target===sheetWrap)sheetWrap.classList.remove('show')};
  document.querySelectorAll('.product-open').forEach(b=>b.onclick=()=>{const alt=b.dataset.kind==='alt';sheet(`<small>${alt?'相似平替 · 库存充足':'官方同款 · 7 天无理由'}</small><h2>${alt?'水洗短款丹宁外套':'复古牛仔短外套'}</h2><div class="big">${alt?'¥199':'¥358'}</div><p>深蓝水洗 · 丹宁棉 ${alt?'98%':'100%'} · XS–XL</p><div class="panel">${alt?'比同款省 ¥159，短款比例一致，面料更柔软。':'博主同款版型，肩线挺括；无弹面料建议按尺码表选购。'}</div><div class="sheet-actions"><button class="round" onclick="sheetWrap.classList.remove('show')">继续逛</button><button class="cta" onclick="pop('已加入购物车');sheetWrap.classList.remove('show')">加入购物车</button></div>`)});
  document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{const isTry=b.dataset.ai==='try';sheet(`<div id="aiLoading" class="loading show"><div class="spinner"></div><h2>${isTry?'正在准备试穿间':'正在生成同款延展'}</h2><p>${isTry?'保留当前整套商品与尺码建议':'保留牛仔外套，替换内搭与下装'}</p></div><div id="aiResult" class="result"><small>${isTry?'AI 试穿入口已打开':'AI 搭配已完成'}</small><h2>${isTry?'上传正面全身照':'周五轻通勤方案'}</h2><div class="look-result"></div><div class="panel">${isTry?'支持相册或拍照；照片仅用于本次试穿演示。':'保留牛仔外套，换成米白针织与深棕直筒裙。预计整套 ¥729。'}</div><div class="sheet-actions"><button class="round" onclick="sheetWrap.classList.remove('show')">返回详情</button><button class="cta" onclick="pop('${isTry?'已选择相册':'已收藏方案'}')">${isTry?'从相册选择':'收藏方案'}</button></div></div>`);setTimeout(()=>{document.getElementById('aiLoading').classList.remove('show');document.getElementById('aiResult').classList.add('show')},700)});
  document.getElementById('reset').onclick=()=>{localStorage.removeItem('outfit.category');localStorage.removeItem('outfit.screen');location.reload()};renderTabs();renderFeed();if(state.screen==='detail')openDetail();
</script>
</body>
</html>
