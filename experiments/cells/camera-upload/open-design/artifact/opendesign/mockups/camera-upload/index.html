<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>创建试穿形象 · 拍照上传</title>
  <link rel="icon" href="data:," />
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <style>
    :root{--ink:#11131c;--muted:#747782;--lime:#f3ffe9;--pink:#ff006b;--orange:#ff7935;--success:#35c75a;--danger:#df7045;font-family:"Avenir Next","PingFang SC",sans-serif;color:var(--ink)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#ececf0;display:grid;place-items:center} button{font:inherit;border:0;cursor:pointer} button:focus-visible{outline:3px solid #6fd8ff;outline-offset:3px}.phone{width:min(390px,100vw);height:min(844px,100vh);background:#fff;position:relative;overflow:hidden;box-shadow:0 24px 80px #20202a33}.screen{position:absolute;inset:0;animation:enter .24s ease-out}.status{height:42px;padding:14px 22px 0;display:flex;justify-content:space-between;font-weight:700;font-size:13px;position:relative;z-index:5}.home{background:#f7f7f9}.nav{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700}.tabs{display:flex;gap:24px}.tabs span:first-child{border-bottom:3px solid;padding-bottom:9px}.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}.feed-card{height:260px;border-radius:18px;background:linear-gradient(145deg,#d9dde4,#b6bec8);position:relative;overflow:hidden}.feed-card:after{content:"LOOK";position:absolute;left:14px;bottom:14px;color:#fff;font-size:12px;letter-spacing:.18em}.scrim{position:absolute;inset:0;background:#11131c70}.sheet{position:absolute;left:0;right:0;bottom:0;height:670px;background:linear-gradient(180deg,var(--lime),#fff 30%);border-radius:26px 26px 0 0;padding:30px 26px 24px;text-align:center;animation:sheet .3s ease-out}.close{position:absolute;right:18px;top:18px;width:48px;height:48px;border-radius:50%;background:#e8f4dc;font-size:30px}.sheet h1{font-size:30px;margin:72px 0 6px}.sheet .sub{color:#656872;margin:0 0 34px}.upload-card{width:178px;height:214px;margin:0 auto 32px;background:#fff;border:5px solid #f5f5f7;border-radius:20px;box-shadow:0 14px 38px #17202916;display:grid;place-items:center;transition:.2s}.upload-card:hover{transform:translateY(-3px);box-shadow:0 18px 44px #17202924}.plus{display:block;font-size:46px;line-height:1}.guides{display:flex;justify-content:space-between;gap:12px}.guide{font-size:12px;color:#73757e;flex:1}.guide .face{height:54px;border-radius:12px;background:#dde9d6;display:grid;place-items:center;font-size:23px;margin-bottom:7px}.agreement{margin-top:28px;color:#888;font-size:13px}.choices{position:absolute;left:10px;right:10px;bottom:10px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 12px 50px #0005;animation:sheet .22s ease-out}.choices header{padding:20px 16px 14px;color:#777}.choice{width:100%;height:72px;background:#fff;color:#2878f0;font-size:20px;border-top:1px solid #eee}.choice:hover{background:#f6f8ff}.camera{background:#050505;color:#fff}.camera-photo{position:absolute;inset:0;background:url("assets/camera-reference.png") center/cover no-repeat;transition:transform .35s ease}.camera-photo.rear{transform:scaleX(-1)}.shade{position:absolute;inset:0;background:linear-gradient(#0008 0,#0000 24%,#0000 68%,#000a 100%)}.camera-top{position:absolute;top:48px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}.icon-btn{min-width:48px;min-height:48px;border-radius:24px;background:#0007;color:#fff;display:grid;place-items:center;font-size:22px;transition:.18s}.icon-btn:hover{background:#fff;color:#111}.tools{display:grid;gap:8px;text-align:center;font-size:12px}.facing{padding:6px 10px;background:#0008;border-radius:12px}.frame-guide{position:absolute;inset:155px 78px 190px;border:2px dashed #ffffffa0;border-radius:46% 46% 42% 42%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;color:#fff;font-size:12px}.camera-bottom{position:absolute;left:26px;right:26px;bottom:38px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;text-align:center}.album-btn{justify-self:center;width:58px;height:58px;border-radius:15px;background:#ffffffd0;color:#111;font-size:12px}.album-btn:hover{transform:scale(1.05)}.shutter{justify-self:center;width:78px;height:78px;border:6px solid #fff;border-radius:50%;background:#fff5;box-shadow:inset 0 0 0 3px #0004;transition:.15s}.shutter:hover{transform:scale(1.06)}.shutter:active{transform:scale(.93)}.confirm-actions{position:absolute;bottom:38px;left:26px;right:26px;display:flex;justify-content:space-between}.text-btn{min-width:96px;min-height:48px;background:#0008;border-radius:24px;color:#fff;font-weight:700}.text-btn:hover{background:#fff;color:#111}.album-panel{background:#f5f5f7;padding:68px 18px 18px}.album-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.thumb{aspect-ratio:1;border-radius:8px;background-position:center;background-size:cover;border:3px solid transparent}.thumb:hover{border-color:var(--pink)}.review{background:linear-gradient(180deg,var(--lime),#fff 30%);padding:72px 28px 26px;text-align:center}.review h1{font-size:28px;margin:18px 0 4px}.photo-card{width:190px;height:235px;border-radius:22px;background:url("assets/camera-reference.png") center/cover;box-shadow:0 14px 36px #1112;margin:52px auto 32px;overflow:hidden;position:relative}.badge{position:absolute;left:0;right:0;bottom:0;padding:12px;color:#fff;background:var(--danger);font-weight:700}.badge.ok{background:var(--success)}.rules{display:flex;gap:8px}.rule{flex:1;color:#6f717b;font-size:12px}.rule b{display:grid;place-items:center;margin:0 auto 6px;width:45px;height:45px;border-radius:12px;background:#eef3eb;color:var(--success);font-size:20px}.bottom-actions{position:absolute;bottom:26px;left:22px;right:22px;display:flex;gap:12px}.pill{min-height:56px;border-radius:28px;flex:1;background:#f0f0f2;font-weight:700;font-size:17px}.pill.primary{color:#fff;background:linear-gradient(90deg,var(--orange),var(--pink))}.pill:hover{transform:translateY(-2px);filter:brightness(.97)}.loading{background:#fff;display:grid;place-items:center;text-align:center;padding:40px}.spinner{width:56px;height:56px;border:5px solid #eee;border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;margin:auto}.loading h2{margin:24px 0 6px}.loading p{color:var(--muted)}.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:12px;z-index:10;white-space:nowrap}.debug{position:absolute;right:8px;bottom:8px;font-size:9px;color:#ffffff80}.hidden{display:none}@keyframes enter{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}@keyframes sheet{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const KEY='camera-upload-open-design-v1';
const initial={screen:'create',choices:false,facing:'front',photo:false,review:'idle',toast:''};
function load(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return initial}}
function App(){const [s,setS]=useState(load); const go=(patch)=>setS(v=>({...v,...patch}));
 useEffect(()=>localStorage.setItem(KEY,JSON.stringify({...s,toast:''})),[s]);
 useEffect(()=>{if(!s.toast)return;const t=setTimeout(()=>go({toast:''}),1400);return()=>clearTimeout(t)},[s.toast]);
 const camera=(extra={})=>go({screen:'camera',choices:false,review:'idle',...extra});
 const choosePhoto=()=>go({screen:'confirm',photo:true,toast:'已选择照片'});
 const usePhoto=()=>{go({screen:'loading',review:'loading'});setTimeout(()=>go({screen:'review',review:'failed'}),900)};
 const retry=()=>go({screen:'create',choices:true,photo:false,review:'idle'});
 return <div className="phone" data-screen={s.screen} data-facing={s.facing} data-review={s.review}>
  {s.toast&&<div className="toast" role="status">{s.toast}</div>}
  {s.screen==='create'&&<Create choices={s.choices} open={()=>go({choices:true})} closeChoices={()=>go({choices:false})} camera={()=>camera()} album={()=>go({screen:'album',choices:false})}/>} 
  {s.screen==='camera'&&<Camera facing={s.facing} close={()=>go({screen:'create',choices:true})} flip={()=>go({facing:s.facing==='front'?'rear':'front',toast:`已切换至${s.facing==='front'?'后置':'前置'}摄像头`})} album={()=>go({screen:'album'})} shutter={()=>go({screen:'confirm',photo:true})}/>} 
  {s.screen==='album'&&<Album close={()=>camera()} choose={choosePhoto}/>} 
  {s.screen==='confirm'&&<Confirm facing={s.facing} retake={()=>camera({photo:false})} use={usePhoto}/>} 
  {s.screen==='loading'&&<Loading/>}
  {s.screen==='review'&&<Review state={s.review} retry={retry} done={()=>go({review:'success',toast:'形象创建完成'})}/>} 
  <span className="debug">{s.screen}/{s.facing}/{s.review}</span>
 </div>}
function Create({choices,open,closeChoices,camera,album}){return <div className="screen home"><div className="status"><span>9:41</span><span>● ◒ ▰</span></div><div className="nav"><span>☰</span><div className="tabs"><span>穿搭</span><span>直播</span><span>推荐</span></div><span>⌕</span></div><div className="feed"><div className="feed-card"></div><div className="feed-card"></div></div><div className="scrim"></div><section className="sheet"><button className="close" aria-label="关闭创建形象">×</button><h1>创建我的试穿形象</h1><p className="sub">上传1张面部清晰照片，即可开始试穿</p><button className="upload-card" data-testid="open-upload" onClick={open}><span><b className="plus">＋</b>上传1张照片</span></button><div className="guides"><Guide icon="✓" text="正脸照片"/><Guide icon="×" text="面部无遮挡"/><Guide icon="1" text="单人照片"/></div><div className="agreement">○ 已阅读并同意 <u>试穿功能用户协议</u></div></section>{choices&&<><button className="scrim" aria-label="收起照片来源" onClick={closeChoices}></button><section className="choices" data-testid="upload-choices"><header>选择照片来源<br/><small>上传 1 张面部清晰的照片创建试穿形象</small></header><button className="choice" data-testid="camera-choice" onClick={camera}>拍照</button><button className="choice" data-testid="album-choice" onClick={album}>从相册选择</button></section></>}</div>}
function Guide({icon,text}){return <div className="guide"><div className="face">{icon}</div>{text}</div>}
function Camera({facing,close,flip,album,shutter}){return <div className="screen camera"><div className={'camera-photo '+(facing==='rear'?'rear':'')}></div><div className="shade"></div><div className="camera-top"><button className="icon-btn" data-testid="close-camera" aria-label="关闭相机" onClick={close}>×</button><div className="tools"><button className="icon-btn" data-testid="flip-camera" onClick={flip}>↻</button><span>翻转</span><span className="facing">{facing==='front'?'前置':'后置'}</span></div></div><div className="frame-guide">请保持单人正脸 · 光线充足</div><div className="camera-bottom"><button className="album-btn" data-testid="open-album" onClick={album}>▧<br/>相册</button><button className="shutter" data-testid="shutter" aria-label="拍照" onClick={shutter}></button><span></span></div></div>}
function Album({close,choose}){return <div className="screen album-panel"><div className="album-head"><button className="icon-btn" style={{background:'#fff',color:'#111'}} onClick={close}>‹</button><h2>最近项目</h2><span style={{width:48}}></span></div><p>选择一张面部清晰的单人照片</p><div className="album-grid" data-testid="album-state">{['camera-reference.png','portrait-example.png','camera-reference.png','portrait-example.png','camera-reference.png','portrait-example.png'].map((x,i)=><button key={i} aria-label={`选择照片 ${i+1}`} className="thumb" style={{backgroundImage:`url(assets/${x})`}} onClick={choose}></button>)}</div></div>}
function Confirm({facing,retake,use}){return <div className="screen camera"><div className={'camera-photo '+(facing==='rear'?'rear':'')}></div><div className="shade"></div><div className="confirm-actions"><button className="text-btn" data-testid="retake" onClick={retake}>重拍</button><button className="text-btn" data-testid="use-photo" onClick={use}>使用照片</button></div></div>}
function Loading(){return <div className="screen loading" data-testid="review-loading"><div><div className="spinner"></div><h2>正在审核照片</h2><p>检查清晰度、正脸与单人画面…</p></div></div>}
function Review({state,retry,done}){const failed=state!=='success';return <div className="screen review"><h1>创建我的试穿形象</h1><p>上传1张面部清晰照片，即可开始试穿</p><div className="photo-card"><div className={'badge '+(!failed?'ok':'')} data-testid="review-result">{failed?'ⓘ 照片内容不符合规范，请重新上传':'✓ 上传成功'}</div></div>{failed&&<p style={{color:'#b84e32',fontSize:13}}>请确保正脸、无遮挡、画面中只有一人，再试一次。</p>}<div className="rules"><Guide icon="✓" text="正脸照片"/><Guide icon="×" text="面部无遮挡"/><Guide icon="1" text="单人照片"/></div><div className="bottom-actions"><button className="pill" data-testid="retry" onClick={retry}>重新上传</button><button className="pill primary" disabled={failed} onClick={done}>完成</button></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
