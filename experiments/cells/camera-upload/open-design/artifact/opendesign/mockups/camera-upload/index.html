<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>创建试穿形象 · 拍照上传</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../../design-systems/camera-product/tokens/colors_and_type.css" />
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <style>
    :root{--ink:var(--fg-1);--muted:var(--fg-2);--lime:var(--bg-lime);--pink:var(--accent-1);--orange:var(--accent-2);font-family:var(--font-body);color:var(--ink)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--canvas-bg);display:grid;place-items:center} button{font:inherit;border:0;cursor:pointer} button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.phone{width:min(390px,100vw);height:min(844px,100vh);background:var(--bg-1);position:relative;overflow:hidden;box-shadow:var(--shadow-phone)}.screen{position:absolute;inset:0;animation:enter .24s ease-out}.status{height:42px;padding:14px 22px 0;display:flex;justify-content:space-between;font-weight:700;font-size:13px;position:relative;z-index:5}.home{background:var(--home-bg)}.nav{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700}.tabs{display:flex;gap:24px}.tabs span:first-child{border-bottom:3px solid;padding-bottom:9px}.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}.feed-card{height:260px;border-radius:18px;background:linear-gradient(145deg,var(--feed-1),var(--feed-2));position:relative;overflow:hidden}.feed-card:after{content:"LOOK";position:absolute;left:14px;bottom:14px;color:var(--bg-1);font-size:12px;letter-spacing:.18em}.scrim{position:absolute;inset:0;background:var(--scrim)}.sheet{position:absolute;left:0;right:0;bottom:0;height:670px;background:linear-gradient(180deg,var(--lime),var(--bg-1) 30%);border-radius:26px 26px 0 0;padding:30px 26px 24px;text-align:center;animation:sheet .3s ease-out}.close{position:absolute;right:18px;top:18px;width:48px;height:48px;border-radius:50%;background:var(--close-bg);font-size:30px}.sheet h1{font:var(--h1);margin:72px 0 6px}.sheet .sub{color:var(--fg-2);margin:0 0 34px}.upload-card{width:178px;height:214px;margin:0 auto 32px;background:var(--bg-1);border:5px solid var(--card-border);border-radius:20px;box-shadow:var(--shadow-card);display:grid;place-items:center;transition:.2s}.upload-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-card-hover)}.plus{display:block;font-size:46px;line-height:1}.guides{display:flex;justify-content:space-between;gap:12px}.guide{font-size:12px;color:var(--fg-2);flex:1}.guide .face{height:54px;border-radius:12px;background:var(--guide-bg);display:grid;place-items:center;font-size:23px;margin-bottom:7px}.agreement{margin-top:28px;color:var(--fg-2);font-size:13px}.link-button{background:none;color:var(--link);text-decoration:underline;padding:8px 2px}.home-cta{position:absolute;left:24px;right:24px;bottom:34px;min-height:56px;border-radius:28px;background:linear-gradient(90deg,var(--orange),var(--pink));color:var(--bg-1);font-weight:700}.dialog{position:absolute;z-index:20;inset:140px 24px auto;background:var(--bg-1);border-radius:22px;padding:26px;box-shadow:var(--shadow-pop);text-align:left}.dialog h2{margin:0 0 12px}.dialog p{color:var(--fg-2)}.dialog .close-dialog{float:right;min-width:44px;min-height:44px;border-radius:22px;background:var(--close-bg)}.choices{position:absolute;left:10px;right:10px;bottom:10px;background:var(--bg-1);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-pop);animation:sheet .22s ease-out}.choices header{padding:20px 16px 14px;color:var(--fg-2)}.choice{width:100%;height:72px;background:var(--bg-1);color:var(--link);font-size:20px;border-top:1px solid var(--border-subtle)}.choice:hover{background:var(--choice-hover)}.camera{background:var(--camera-bg);color:var(--bg-1)}.camera-photo{position:absolute;inset:0;background:url("assets/camera-reference.png") center/cover no-repeat;transition:transform .35s ease}.camera-photo.rear{transform:scaleX(-1)}.shade{position:absolute;inset:0;background:linear-gradient(var(--camera-shade-top) 0,transparent 24%,transparent 68%,var(--camera-shade-bottom) 100%)}.camera-top{position:absolute;top:48px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}.icon-btn{min-width:48px;min-height:48px;border-radius:24px;background:var(--camera-control);color:var(--bg-1);display:grid;place-items:center;font-size:22px;transition:.18s}.icon-btn:hover{background:var(--bg-1);color:var(--fg-1)}.tools{display:grid;gap:8px;text-align:center;font-size:12px}.facing{padding:6px 10px;background:var(--camera-control);border-radius:12px}.frame-guide{position:absolute;inset:155px 78px 190px;border:2px dashed var(--frame-guide);border-radius:46% 46% 42% 42%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;color:var(--bg-1);font-size:12px}.camera-bottom{position:absolute;left:26px;right:26px;bottom:38px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;text-align:center}.album-btn{justify-self:center;width:58px;height:58px;border-radius:15px;background:var(--album-control);color:var(--fg-1);font-size:12px}.album-btn:hover{transform:scale(1.05)}.shutter{justify-self:center;width:78px;height:78px;border:6px solid var(--bg-1);border-radius:50%;background:var(--shutter);box-shadow:inset 0 0 0 3px var(--camera-control);transition:.15s}.shutter:hover{transform:scale(1.06)}.shutter:active{transform:scale(.93)}.confirm-actions{position:absolute;bottom:38px;left:26px;right:26px;display:flex;justify-content:space-between}.text-btn{min-width:96px;min-height:48px;background:var(--camera-control);border-radius:24px;color:var(--bg-1);font-weight:700}.text-btn:hover{background:var(--bg-1);color:var(--fg-1)}.album-panel{background:var(--album-bg);padding:68px 18px 18px}.album-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.thumb{aspect-ratio:1;border-radius:8px;background-position:center;background-size:cover;border:3px solid transparent}.thumb:hover{border-color:var(--pink)}.review{background:linear-gradient(180deg,var(--lime),var(--bg-1) 30%);padding:72px 28px 26px;text-align:center}.review h1{font:var(--h1);margin:18px 0 4px}.photo-card{width:190px;height:235px;border-radius:22px;background:url("assets/camera-reference.png") center/cover;box-shadow:var(--shadow-card);margin:52px auto 32px;overflow:hidden;position:relative}.photo-card.success-photo{background-image:url("assets/portrait-example.png")}.badge{position:absolute;left:0;right:0;bottom:0;padding:12px;color:var(--bg-1);background:var(--danger);font-weight:700}.badge.ok{background:var(--success)}.rules{display:flex;gap:8px}.rule{flex:1;color:var(--fg-2);font-size:12px}.rule b{display:grid;place-items:center;margin:0 auto 6px;width:45px;height:45px;border-radius:12px;background:var(--guide-bg);color:var(--success);font-size:20px}.bottom-actions{position:absolute;bottom:26px;left:22px;right:22px;display:flex;gap:12px}.pill{min-height:56px;border-radius:28px;flex:1;background:var(--pill-bg);font-weight:700;font-size:17px}.pill.primary{color:var(--bg-1);background:linear-gradient(90deg,var(--orange),var(--pink))}.pill:hover{transform:translateY(-2px);filter:brightness(.97)}.loading{background:var(--bg-1);display:grid;place-items:center;text-align:center;padding:40px}.spinner{width:56px;height:56px;border:5px solid var(--pill-bg);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;margin:auto}.loading h2{margin:24px 0 6px}.loading p{color:var(--muted)}.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:var(--fg-1);color:var(--bg-1);padding:10px 16px;border-radius:20px;font-size:12px;z-index:10;white-space:nowrap}.hidden{display:none}@keyframes enter{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}@keyframes sheet{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const KEY='camera-upload-open-design-v1';
const initial={screen:'create',creatorOpen:true,choices:false,policyOpen:false,facing:'front',photo:false,photoOutcome:'failed',review:'idle',toast:''};
function load(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return initial}}
function App(){const [s,setS]=useState(load); const go=(patch)=>setS(v=>({...v,...patch}));
 useEffect(()=>localStorage.setItem(KEY,JSON.stringify({...s,toast:''})),[s]);
 useEffect(()=>{if(!s.toast)return;const t=setTimeout(()=>go({toast:''}),1400);return()=>clearTimeout(t)},[s.toast]);
 const camera=(extra={})=>go({screen:'camera',choices:false,review:'idle',...extra});
 const choosePhoto=(outcome)=>go({screen:'confirm',photo:true,photoOutcome:outcome,toast:'已选择照片'});
 const usePhoto=()=>{const outcome=s.photoOutcome;go({screen:'loading',review:'loading'});setTimeout(()=>go({screen:'review',review:outcome}),900)};
 const retry=()=>go({screen:'create',choices:true,photo:false,review:'idle'});
 return <div className="phone" data-screen={s.screen} data-facing={s.facing} data-review={s.review}>
  {s.toast&&<div className="toast" role="status">{s.toast}</div>}
  {s.screen==='create'&&<Create creatorOpen={s.creatorOpen} choices={s.choices} policyOpen={s.policyOpen} openCreator={()=>go({creatorOpen:true})} closeCreator={()=>go({creatorOpen:false,choices:false,policyOpen:false})} openPolicy={()=>go({policyOpen:true})} closePolicy={()=>go({policyOpen:false})} open={()=>go({choices:true})} closeChoices={()=>go({choices:false})} camera={()=>camera({photoOutcome:'failed'})} album={()=>go({screen:'album',choices:false})}/>}
  {s.screen==='camera'&&<Camera facing={s.facing} close={()=>go({screen:'create',choices:true})} flip={()=>go({facing:s.facing==='front'?'rear':'front',toast:`已切换至${s.facing==='front'?'后置':'前置'}摄像头`})} album={()=>go({screen:'album'})} shutter={()=>go({screen:'confirm',photo:true})}/>} 
  {s.screen==='album'&&<Album close={()=>camera()} choose={choosePhoto}/>} 
  {s.screen==='confirm'&&<Confirm facing={s.facing} retake={()=>camera({photo:false})} use={usePhoto}/>} 
  {s.screen==='loading'&&<Loading/>}
  {s.screen==='review'&&<Review state={s.review} retry={retry} done={()=>go({review:'success',toast:'形象创建完成'})}/>} 
 </div>}
function Create({creatorOpen,choices,policyOpen,openCreator,closeCreator,openPolicy,closePolicy,open,closeChoices,camera,album}){return <div className="screen home"><div className="status"><span>9:41</span><span>● ◒ ▰</span></div><div className="nav"><span>☰</span><div className="tabs"><span>穿搭</span><span>直播</span><span>推荐</span></div><span>⌕</span></div><div className="feed"><div className="feed-card"></div><div className="feed-card"></div></div>{!creatorOpen&&<button className="home-cta" data-testid="open-creator" onClick={openCreator}>创建试穿形象</button>}{creatorOpen&&<><div className="scrim"></div><section className="sheet"><button className="close" aria-label="关闭创建形象" onClick={closeCreator}>×</button><h1>创建我的试穿形象</h1><p className="sub">上传1张面部清晰照片，即可开始试穿</p><button className="upload-card" data-testid="open-upload" onClick={open}><span><b className="plus">＋</b>上传1张照片</span></button><div className="guides"><Guide icon="✓" text="正脸照片"/><Guide icon="×" text="面部无遮挡"/><Guide icon="1" text="单人照片"/></div><div className="agreement">○ 已阅读并同意 <button className="link-button" data-testid="open-policy" onClick={openPolicy}>试穿功能用户协议</button></div></section></>}{policyOpen&&<><div className="scrim"></div><section className="dialog" role="dialog" data-testid="policy-dialog" aria-modal="true"><button className="close-dialog" aria-label="关闭用户协议" onClick={closePolicy}>×</button><h2>试穿功能用户协议</h2><p>照片仅用于本次试穿形象创建。请确认你拥有照片使用权，并避免上传包含他人的照片。</p></section></>}{choices&&<><button className="scrim" aria-label="收起照片来源" onClick={closeChoices}></button><section className="choices" data-testid="upload-choices"><header>选择照片来源<br/><small>上传 1 张面部清晰的照片创建试穿形象</small></header><button className="choice" data-testid="camera-choice" onClick={camera}>拍照</button><button className="choice" data-testid="album-choice" onClick={album}>从相册选择</button></section></>}</div>}
function Guide({icon,text}){return <div className="guide"><div className="face">{icon}</div>{text}</div>}
function Camera({facing,close,flip,album,shutter}){return <div className="screen camera"><div className={'camera-photo '+(facing==='rear'?'rear':'')}></div><div className="shade"></div><div className="camera-top"><button className="icon-btn" data-testid="close-camera" aria-label="关闭相机" onClick={close}>×</button><div className="tools"><button className="icon-btn" data-testid="flip-camera" onClick={flip}>↻</button><span>翻转</span><span className="facing">{facing==='front'?'前置':'后置'}</span></div></div><div className="frame-guide">请保持单人正脸 · 光线充足</div><div className="camera-bottom"><button className="album-btn" data-testid="open-album" onClick={album}>▧<br/>相册</button><button className="shutter" data-testid="shutter" aria-label="拍照" onClick={shutter}></button><span></span></div></div>}
function Album({close,choose}){const photos=[['portrait-example.png','success','选择合规照片'],['camera-reference.png','failed','选择照片 2'],['portrait-example.png','success','选择照片 3'],['camera-reference.png','failed','选择照片 4'],['portrait-example.png','success','选择照片 5'],['camera-reference.png','failed','选择照片 6']];return <div className="screen album-panel"><div className="album-head"><button className="icon-btn" style={{background:'var(--bg-1)',color:'var(--fg-1)'}} onClick={close}>‹</button><h2>最近项目</h2><span style={{width:48}}></span></div><p>选择一张面部清晰的单人照片</p><div className="album-grid" data-testid="album-state">{photos.map(([x,outcome,label],i)=><button key={i} aria-label={label} className="thumb" style={{backgroundImage:`url(assets/${x})`}} onClick={()=>choose(outcome)}></button>)}</div></div>}
function Confirm({facing,retake,use}){return <div className="screen camera"><div className={'camera-photo '+(facing==='rear'?'rear':'')}></div><div className="shade"></div><div className="confirm-actions"><button className="text-btn" data-testid="retake" onClick={retake}>重拍</button><button className="text-btn" data-testid="use-photo" onClick={use}>使用照片</button></div></div>}
function Loading(){return <div className="screen loading" data-testid="review-loading"><div><div className="spinner"></div><h2>正在审核照片</h2><p>检查清晰度、正脸与单人画面…</p></div></div>}
function Review({state,retry,done}){const failed=state!=='success';return <div className="screen review"><h1>创建我的试穿形象</h1><p>上传1张面部清晰照片，即可开始试穿</p><div className={'photo-card '+(!failed?'success-photo':'')}><div className={'badge '+(!failed?'ok':'')} data-testid="review-result">{failed?'ⓘ 照片内容不符合规范，请重新上传':'✓ 上传成功'}</div></div>{failed&&<p style={{color:'var(--danger)',fontSize:13}}>请确保正脸、无遮挡、画面中只有一人，再试一次。</p>}<div className="rules"><Guide icon="✓" text="正脸照片"/><Guide icon="×" text="面部无遮挡"/><Guide icon="1" text="单人照片"/></div><div className="bottom-actions"><button className="pill" data-testid="retry" onClick={retry}>重新上传</button><button className="pill primary" disabled={failed} onClick={done}>完成</button></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
