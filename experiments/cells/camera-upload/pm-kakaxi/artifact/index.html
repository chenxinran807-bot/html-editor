<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>AI 试穿 · 拍照上传评审原型</title>
  <style>
    :root{--ink:#14151c;--muted:#777985;--surface:#fff;--canvas:#e8e9ee;--lime:#e9ffd1;--pink:#ff4f9a;--orange:#ff8245;--blue:#165dff;--danger:#e76f43;--success:#42c866;--shadow:0 22px 70px rgba(23,26,39,.22);font-family:"Avenir Next","PingFang SC",sans-serif;color:var(--ink)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--canvas)}button{font:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid #61d5ff;outline-offset:3px}.scenario-bar{height:72px;background:linear-gradient(135deg,#165DFF 0%,#0E42D2 100%);display:flex;align-items:center;gap:10px;padding:0 24px;color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 8px 24px #0e42d244}.scenario-title{font-weight:800;margin-right:10px}.scenario-bar button{min-height:42px;padding:0 16px;border-radius:21px;background:#ffffff2e;color:#fff;transition:all .2s ease}.scenario-bar button.active{background:#fff;color:#165dff}.scenario-note{margin-left:auto;font-size:12px;opacity:.78}.stage{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:18px}.phone{position:relative;width:390px;height:min(844px,calc(100vh - 108px));min-height:720px;background:#fff;border-radius:34px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #ffffffb5}.screen{position:absolute;inset:0}.status{height:42px;display:flex;justify-content:space-between;padding:14px 22px 0;font-size:13px;font-weight:800;position:relative;z-index:3}.home{background:#f7f7f9}.nav{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:800}.tabs{display:flex;gap:24px}.tabs span:first-child{border-bottom:3px solid;padding-bottom:8px}.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.look{height:260px;border-radius:18px;background:linear-gradient(150deg,#e7e8eb,#bbc2cd);position:relative}.look:after{content:"AI LOOK";position:absolute;bottom:12px;left:12px;color:#fff;font-size:11px;letter-spacing:.15em}.scrim{position:absolute;inset:0;background:#13151d70}.creator{position:absolute;inset:auto 0 0;height:670px;background:linear-gradient(180deg,var(--lime),#fff 29%);border-radius:28px 28px 0 0;text-align:center;padding:28px 26px 22px}.close-sheet{position:absolute;right:18px;top:18px;width:48px;height:48px;border-radius:50%;background:#e4f3d8;font-size:28px}.creator h1{font-size:30px;margin:76px 0 7px}.creator>p{margin:0;color:#686a75}.upload-card{display:grid;place-items:center;width:180px;height:212px;margin:34px auto 25px;border:6px solid #fff;border-radius:22px;background:linear-gradient(145deg,#fffde8,#eafaff);box-shadow:0 15px 42px #1921301c;font-size:18px;font-weight:700;transition:.2s}.upload-card:hover{transform:translateY(-3px)}.plus{font-size:48px;display:block}.tips{display:flex;gap:10px}.tip{flex:1;color:#777985;font-size:12px}.tip i{font-style:normal;display:grid;place-items:center;width:50px;height:50px;margin:auto auto 7px;background:#ecf4e8;border-radius:14px;color:#2ebd58;font-size:20px}.agreement{margin-top:24px;font-size:12px;color:#8a8c94}.source-sheet{position:absolute;z-index:8;left:10px;right:10px;bottom:10px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.source-sheet header{text-align:center;padding:18px;color:#72747e}.source-sheet header b{display:block;color:#222;margin-bottom:4px}.choice{height:70px;width:100%;background:#fff;border-top:1px solid #e8e8eb;color:#2375f3;font-size:19px}.choice:hover{background:#f4f7ff}.camera{background:#050505;color:#fff}.camera-img{position:absolute;inset:0;background:url("assets/camera.png") center/160% auto no-repeat}.camera.rear .camera-img{transform:scaleX(-1)}.camera-shade{position:absolute;inset:0;background:linear-gradient(#0008,transparent 24%,transparent 67%,#000b)}.camera-top{position:absolute;left:18px;right:18px;top:48px;display:flex;justify-content:space-between}.round{width:50px;height:50px;border-radius:50%;background:#0007;color:#fff;font-size:24px}.tool-wrap{text-align:center;font-size:12px}.facing{position:absolute;right:18px;top:122px;background:#0008;border-radius:14px;padding:6px 10px;font-size:12px}.camera-guide{position:absolute;inset:155px 82px 190px;border:2px dashed #ffffffa0;border-radius:48%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;font-size:12px}.camera-bottom{position:absolute;bottom:34px;left:24px;right:24px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}.album-btn{justify-self:center;width:60px;height:60px;border-radius:15px;background:#ffffffce;color:#171820}.shutter{justify-self:center;width:80px;height:80px;border-radius:50%;border:6px solid #fff;background:#ffffff55;box-shadow:inset 0 0 0 3px #0005}.album-panel{position:absolute;inset:0;z-index:9;background:#f8f8fa;color:#111}.album-head{height:96px;padding:48px 18px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}.album-grid button{aspect-ratio:1;padding:0;background:#ddd;overflow:hidden}.album-grid img{width:100%;height:100%;object-fit:cover}.confirm{background:#050505;color:#fff}.confirm-img{position:absolute;inset:0;background:url("assets/captured.png") center/160% auto no-repeat}.confirm-actions{position:absolute;bottom:36px;left:25px;right:25px;display:flex;justify-content:space-between}.text-btn{min-height:50px;min-width:105px;border-radius:25px;background:#0008;color:#fff;font-weight:800}.loading{display:grid;place-items:center;text-align:center;background:#fff}.spinner{width:58px;height:58px;margin:auto;border:5px solid #eee;border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}.loading p{color:var(--muted)}.result{background:linear-gradient(180deg,var(--lime),#fff 30%);padding:70px 28px 24px;text-align:center}.result h1{font-size:28px;margin:14px 0 4px}.result>p{color:var(--muted);margin:0}.photo-card{width:190px;height:240px;margin:45px auto 22px;border-radius:22px;background:url("assets/captured.png") center/160% auto no-repeat;position:relative;overflow:hidden;box-shadow:0 14px 36px #1112}.error-strip{position:absolute;left:0;right:0;bottom:0;background:var(--danger);padding:12px;color:#fff;font-weight:700}.guidance{font-size:13px;color:#b45232;margin-bottom:18px}.retry{position:absolute;left:24px;right:24px;bottom:24px;height:56px;border-radius:28px;background:linear-gradient(90deg,#dfff62,var(--pink));font-weight:800;font-size:17px}.edge{display:grid;place-items:center;padding:32px;text-align:center;background:#fff}.edge-icon{width:84px;height:84px;border-radius:28px;background:#fff1e9;display:grid;place-items:center;font-size:36px;color:var(--danger)}.edge p{color:var(--muted);max-width:280px}.edge-actions{display:grid;gap:10px;width:100%;max-width:290px}.edge-actions button{height:52px;border-radius:26px;background:#f0f1f4;font-weight:700}.edge-actions .primary{background:linear-gradient(90deg,#dfff62,var(--pink))}.inference{position:absolute;left:14px;top:14px;background:#fff8;color:#333;padding:6px 9px;border-radius:12px;font-size:10px;z-index:12}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:800px){.scenario-bar{height:auto;min-height:72px;flex-wrap:wrap;padding:10px}.scenario-note{display:none}.stage{padding:0}.phone{border-radius:0;height:calc(100vh - 118px);min-height:650px}.scenario-title{width:100%}}
  </style>
</head>
<body>
  <nav class="scenario-bar" data-testid="scenario-bar" aria-label="评审场景">
    <span class="scenario-title">卡卡西评审场景</span>
    <button class="active" data-scene="normal">主流程</button>
    <button data-scene="permission">权限拒绝</button>
    <button data-scene="empty">空相册</button>
    <button data-scene="timeout">审核超时</button>
    <span class="scenario-note">异常场景为默认推断 · 非原稿还原</span>
  </nav>
  <main class="stage"><div class="phone" id="phone"></div></main>
  <script>
    const phone=document.querySelector('#phone');
    const state={screen:'create',choices:false,facing:'front',album:false};
    const tips=`<div class="tips"><div class="tip"><i>✓</i>正脸照片</div><div class="tip"><i>◯</i>面部无遮挡</div><div class="tip"><i>1</i>单人照片</div></div>`;
    function render(){
      if(state.screen==='create') return renderCreate();
      if(state.screen==='camera') return renderCamera();
      if(state.screen==='confirm') return renderConfirm();
      if(state.screen==='loading') return renderLoading();
      if(state.screen==='failure') return renderFailure();
      if(state.screen==='permission') return renderEdge('permission-error','相机权限未开启','需要允许访问相机才能现场拍摄。你也可以返回并从相册选择。','去拍照设置','permission-retry');
      if(state.screen==='empty') return renderEdge('empty-album','相册里还没有照片','现场拍一张清晰的单人正脸照片，会更快完成形象创建。','现在拍照','empty-camera');
      if(state.screen==='timeout') return renderTimeout();
    }
    function baseHome(){return `<section class="screen home"><div class="status"><span>9:41</span><span>● ◒ ▰</span></div><div class="nav"><span>☰</span><div class="tabs"><span>穿搭</span><span>直播</span><span>推荐</span></div><span>⌕</span></div><div class="feed"><div class="look"></div><div class="look"></div></div><div class="scrim"></div><section class="creator"><h1>创建我的试穿形象</h1><p>上传1张面部清晰照片，即可开始试穿</p><button class="upload-card" data-testid="upload-card"><span><b class="plus">＋</b>上传1张照片</span></button>${tips}<div class="agreement">○ 已阅读并同意试穿功能用户协议</div></section></section>`}
    function renderCreate(){phone.dataset.screen='create';phone.removeAttribute('data-facing');phone.innerHTML=baseHome()+(state.choices?`<button class="scrim" aria-label="收起来源选择"></button><section class="source-sheet" data-testid="source-sheet"><header><b>选择照片来源</b>上传 1 张面部清晰照片创建试穿形象</header><button class="choice" data-testid="choose-camera">拍照</button><button class="choice" data-testid="choose-album">从相册选择</button></section>`:'');bindCommon();if(state.choices){q('[data-testid=choose-camera]').onclick=()=>goCamera();q('[data-testid=choose-album]').onclick=()=>{state.screen='camera';state.album=true;render()};q('.source-sheet').previousElementSibling.onclick=()=>{state.choices=false;render()}}}
    function renderCamera(){phone.dataset.screen='camera';phone.dataset.facing=state.facing;phone.innerHTML=`<section class="screen camera ${state.facing==='rear'?'rear':''}"><div class="camera-img"></div><div class="camera-shade"></div><div class="camera-top"><button class="round" data-testid="close-camera" aria-label="关闭相机">×</button><div class="tool-wrap"><button class="round" data-testid="flip-camera" aria-label="翻转相机">↻</button><div>翻转</div></div></div><span class="facing">${state.facing==='front'?'前置':'后置'}摄像头</span><div class="camera-guide">保持单人正脸 · 光线充足</div><div class="camera-bottom"><button class="album-btn" data-testid="open-album">▧<br/>相册</button><button class="shutter" data-testid="shutter" aria-label="拍照"></button><span></span></div>${state.album?albumMarkup():''}</section>`;q('[data-testid=close-camera]').onclick=()=>{state.screen='create';state.choices=true;state.album=false;render()};q('[data-testid=flip-camera]').onclick=()=>{state.facing=state.facing==='front'?'rear':'front';render()};q('[data-testid=open-album]').onclick=()=>{state.album=true;render()};q('[data-testid=shutter]').onclick=()=>{state.screen='confirm';state.album=false;render()};bindAlbum()}
    function albumMarkup(){return `<section class="album-panel" data-testid="album-panel"><div class="album-head"><button data-testid="album-cancel">取消</button><b>最近项目</b><span></span></div><div class="album-grid"><button data-photo><img src="assets/captured.png" alt="最近照片 1"></button><button data-photo><img src="assets/reference-create.png" alt="最近照片 2"></button><button data-photo><img src="assets/reference-result.png" alt="最近照片 3"></button></div><p style="text-align:center;color:#777">选择一张清晰的单人正脸照片</p></section>`}
    function bindAlbum(){if(!state.album)return;q('[data-testid=album-cancel]').onclick=()=>{state.album=false;render()};document.querySelectorAll('[data-photo]').forEach(x=>x.onclick=()=>{state.screen='confirm';state.album=false;render()})}
    function renderConfirm(){phone.dataset.screen='confirm';phone.dataset.facing=state.facing;phone.innerHTML=`<section class="screen confirm" data-testid="confirm-photo"><div class="confirm-img"></div><div class="confirm-actions"><button class="text-btn" data-testid="retake">重拍</button><button class="text-btn" data-testid="use-photo">使用照片</button></div></section>`;q('[data-testid=retake]').onclick=()=>goCamera();q('[data-testid=use-photo]').onclick=()=>{state.screen='loading';render();setTimeout(()=>{if(state.screen==='loading'){state.screen='failure';render()}},850)}}
    function renderLoading(){phone.dataset.screen='loading';phone.innerHTML=`<section class="screen loading" data-testid="review-loading"><div><div class="spinner"></div><h2>正在审核照片</h2><p>检查清晰度、正脸与单人画面…</p></div></section>`}
    function renderFailure(){phone.dataset.screen='failure';phone.innerHTML=`<section class="screen result" data-testid="review-failure"><h1>这张照片暂时无法使用</h1><p>请按提示重新拍摄，审核更容易通过</p><div class="photo-card"><div class="error-strip">未检测到清晰正脸，请重新上传</div></div><div class="guidance">请确保正脸、无遮挡，并且画面中只有一人。</div>${tips}<button class="retry" data-testid="retry">重新上传</button></section>`;q('[data-testid=retry]').onclick=()=>{state.screen='create';state.choices=true;render()}}
    function renderEdge(id,title,copy,action,testid){phone.dataset.screen=state.screen;phone.innerHTML=`<section class="screen edge" data-testid="${id}"><span class="inference">评审推断态</span><div><div class="edge-icon">!</div><h2>${title}</h2><p>${copy}</p></div><div class="edge-actions"><button class="primary" data-testid="${testid}">${action}</button><button data-back>返回来源选择</button></div></section>`;q(`[data-testid=${testid}]`).onclick=()=>{if(state.screen==='empty')goCamera();else{state.screen='create';state.choices=true;render()}};q('[data-back]').onclick=()=>{state.screen='create';state.choices=true;render()}}
    function renderTimeout(){phone.dataset.screen='timeout';phone.innerHTML=`<section class="screen edge" data-testid="timeout-error"><span class="inference">评审推断态</span><div><div class="edge-icon">⌛</div><h2>照片审核超时</h2><p>网络似乎不太稳定，本次照片尚未完成检测。</p></div><div class="edge-actions"><button class="primary" data-timeout-retry>重新检测</button><button data-back>重新上传</button></div></section>`;q('[data-timeout-retry]').onclick=()=>{state.screen='loading';render();setTimeout(()=>{state.screen='failure';render()},850)};q('[data-back]').onclick=()=>{state.screen='create';state.choices=true;render()}}
    function q(s){return phone.querySelector(s)}
    function bindCommon(){q('[data-testid=upload-card]').onclick=()=>{state.choices=true;render()}}
    function goCamera(){state.screen='camera';state.album=false;render()}
    document.querySelectorAll('[data-scene]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-scene]').forEach(x=>x.classList.toggle('active',x===btn));const scene=btn.dataset.scene;state.screen=scene==='normal'?'create':scene;state.choices=scene==='normal';state.album=false;render()});
    render();
  </script>
</body>
</html>
