  <style>
    :root{--ink:#11131a;--muted:#777985;--lime:#d9ff66;--pink:#ff84c5;--sheet:#fff;--danger:#eb6b3d;--shadow:0 24px 70px rgba(10,12,20,.22)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#e9e9ed;color:var(--ink)}button{font:inherit}

    .status{height:52px;padding:16px 22px 0;display:flex;justify-content:space-between;font-weight:700}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.tabs{display:flex;gap:30px;font-size:20px;font-weight:700}.tabs span:first-child{border-bottom:3px solid;padding-bottom:10px}.iconbtn{border:0;background:transparent;padding:10px;cursor:pointer;color:inherit}.feed{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 14px}.feed img{width:100%;height:310px;object-fit:cover;border-radius:22px;filter:saturate(.85)}

    .camera{background:#050505;color:white}.camera-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.82)}.camera[data-facing="front"] .camera-media{transform:scaleX(-1);filter:brightness(.8) saturate(.78)}.camera-ui{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32),transparent 24%,transparent 70%,rgba(0,0,0,.52))}.camera-top{display:flex;justify-content:space-between;padding:62px 20px}.round{width:50px;height:50px;border:0;border-radius:50%;background:rgba(0,0,0,.28);color:#fff;font-size:28px;cursor:pointer}.tool{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}.tool strong{font-size:24px}.camera-bottom{position:absolute;left:0;right:0;bottom:46px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}.album-btn{justify-self:center;border:0;background:rgba(255,255,255,.2);color:white;border-radius:15px;width:62px;height:62px;cursor:pointer}.shutter{justify-self:center;width:82px;height:82px;border-radius:50%;border:6px solid white;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 5px rgba(0,0,0,.2);cursor:pointer}.facing{justify-self:center;font-size:12px;background:rgba(0,0,0,.36);padding:8px 12px;border-radius:20px}
    .album{position:absolute;inset:0;background:#f8f8fa;color:#111;transform:translateY(105%);transition:.25s;z-index:3}.album.show{transform:none}.album-head{height:100px;padding:52px 18px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}.album-grid button{border:0;padding:0;background:#ddd;aspect-ratio:1;overflow:hidden;cursor:pointer}.album-grid img{width:100%;height:100%;object-fit:cover}.album-note{text-align:center;color:#777;padding:24px}
    .confirm{background:#000;color:white}.confirm img{width:100%;height:100%;object-fit:cover}.confirm-actions{position:absolute;left:0;right:0;bottom:48px;display:flex;justify-content:space-between;padding:0 28px}.textbtn{border:0;background:rgba(0,0,0,.3);color:white;border-radius:24px;padding:14px 18px;font-weight:700;cursor:pointer}
    .reviewing{background:#fff;display:none;place-content:center;text-align:center}.reviewing.active{display:grid}.spinner{width:54px;height:54px;border:5px solid #eee;border-top-color:#8b52ff;border-radius:50%;animation:spin .8s linear infinite;margin:auto}.reviewing h2{margin:24px 0 8px}.reviewing p{color:#777}@keyframes spin{to{transform:rotate(360deg)}}
    .failed{background:#fff;padding:58px 24px 30px;text-align:center}.failed h1{font-size:29px;margin:30px 0 8px}.failed>p{color:#747681;margin:0 0 25px}.failed-card{position:relative;width:240px;height:320px;margin:auto;border-radius:28px;overflow:hidden;border:6px solid #fff;box-shadow:0 12px 36px rgba(26,30,40,.17)}.failed-card img{width:100%;height:100%;object-fit:cover}.error{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,#d94f26,#ef8b58);color:white;padding:14px 12px;font-weight:700}.tips{display:flex;justify-content:center;gap:18px;margin:30px 0}.tip{width:92px}.tip span{display:grid;place-content:center;margin:auto;width:62px;height:62px;border-radius:18px;background:#f0f5e9;font-size:28px}.tip b{display:block;margin-top:10px;font-size:13px}.retry{width:100%;height:58px;border:0;border-radius:29px;background:linear-gradient(90deg,#dfff64,#ff8ac6);font-size:19px;font-weight:800;cursor:pointer}
    .toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:rgba(17,19,26,.9);color:#fff;padding:11px 16px;border-radius:18px;z-index:9;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    button{transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}button:hover{filter:brightness(.96)}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #7d5cff;outline-offset:3px}.service-link{margin-top:12px;border:0;background:transparent;color:#686a76;text-decoration:underline;cursor:pointer}.service-error{display:none;background:#fff;padding:80px 28px;text-align:center}.service-error.active{display:grid;place-content:center}.service-error .symbol{font-size:54px}.service-error h1{font-size:28px;margin:20px 0 8px}.service-error p{color:#777;line-height:1.6}.error-actions{display:grid;gap:12px;margin-top:28px}.secondary{height:54px;border:0;border-radius:27px;background:#f0f0f3;font-weight:700;cursor:pointer}
    @media(min-width:431px){body{display:grid;place-content:center;min-height:100vh}.phone{height:min(900px,96vh);border-radius:36px}}
  </style>
</head>
<body><main class="phone" id="app">
  <section class="screen home active" id="home"><div class="status"><span>9:41</span><span>● Wi‑Fi ▰</span></div><div class="nav"><button class="iconbtn" id="menu" aria-label="菜单">☰</button><div class="tabs"><span>穿搭</span><span>直播</span><span>推荐</span></div><button class="iconbtn" id="search" aria-label="搜索">⌕</button></div><div class="feed"><img src="assets/create.png" alt="穿搭推荐"><img src="assets/review-failed.png" alt="穿搭推荐"></div><button class="retry" id="create" style="position:absolute;left:26px;right:26px;bottom:28px;width:auto">创建试穿形象</button><div class="backdrop" id="dim"></div><div class="creator" id="creator"><button class="close" id="closeCreator" aria-label="关闭">×</button><h1>创建我的试穿形象</h1><p>上传1张面部清晰照片，即可开始试穿</p><button class="upload-card" id="upload"><span class="plus">⊕</span><b>上传1张照片</b></button></div><div class="source" id="source"><header><b>选择照片来源</b><small>上传 1 张面部清晰的照片创建试穿形象</small></header><button class="choice" id="chooseCamera">拍照</button><button class="choice" id="chooseAlbum">从相册选择</button></div></section>
  <section class="screen camera" id="camera" data-facing="back"><img class="camera-media" src="assets/camera.png" alt="相机预览"><div class="camera-ui"><div class="camera-top"><button class="round" id="closeCamera" aria-label="关闭相机">×</button><button class="round tool" id="flip"><strong>↻</strong><span>翻转</span></button></div><div class="camera-bottom"><button class="album-btn" id="albumButton">相册</button><button class="shutter" id="shutter" aria-label="拍照"></button><span class="facing" id="facing">后置摄像头</span></div></div><div class="album" id="album"><div class="album-head"><button class="iconbtn" id="albumClose">取消</button><b>最近项目</b><span></span></div><div class="album-grid"><button id="albumPhoto"><img src="assets/captured.png" alt="最近照片 1"></button><button id="albumPhoto2"><img src="assets/create.png" alt="最近照片 2"></button><button id="albumPhoto3"><img src="assets/review-failed.png" alt="最近照片 3"></button></div><p class="album-note">选择一张清晰的单人正脸照片</p></div></section>
  <section class="screen confirm" id="confirm"><img src="assets/captured.png" alt="拍摄照片预览"><div class="confirm-actions"><button class="textbtn" id="retake">重拍</button><button class="textbtn" id="usePhoto">使用照片</button></div></section>
  <section class="screen reviewing" id="reviewing"><div><div class="spinner"></div><h2>正在审核照片</h2><p>正在检查清晰度与人物信息…</p></div></section>
  <section class="screen failed" id="failed"><h1>这张照片暂时无法使用</h1><p>请按提示重新拍摄，审核更容易通过</p><div class="failed-card"><img src="assets/captured.png" alt="审核失败照片"><div class="error">未检测到清晰正脸，请重新上传</div></div><div class="tips"><div class="tip"><span>✓</span><b>正脸照片</b></div><div class="tip"><span>◉</span><b>面部无遮挡</b></div><div class="tip"><span>1</span><b>仅一人入镜</b></div></div><button class="retry" id="retry">重新上传</button><button class="service-link" id="simulateTimeout">查看审核服务异常状态</button></section>
  <section class="screen service-error" id="serviceError"><div><div class="symbol">!</div><h1>照片审核暂时不可用</h1><p>网络或审核服务可能超时。照片仍保留，你可以再次审核，或重新选择照片。</p><div class="error-actions"><button class="retry" id="retryReview">再次审核</button><button class="secondary" id="backSources">重新选择照片</button></div></div></section>
  <div class="toast" id="toast"></div>
</main><script>
  const $=s=>document.querySelector(s), screens=['home','camera','confirm','reviewing','failed','serviceError']; let facing='back', timer;
  function show(id){screens.forEach(x=>$('#'+x).classList.toggle('active',x===id)); window.__prototypeState=id}
  function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),1300)}
  function openCreator(){show('home');$('#dim').classList.add('show');$('#creator').classList.add('show')}
  function openSource(){openCreator();$('#source').classList.add('show')}
  function camera(){show('camera');$('#source').classList.remove('show');$('#creator').classList.remove('show');$('#dim').classList.remove('show');$('#camera').dataset.facing=facing;$('#facing').textContent=facing==='back'?'后置摄像头':'前置摄像头'}
  $('#menu').onclick=()=>toast('菜单已打开：此原型聚焦试穿形象创建');$('#search').onclick=()=>toast('搜索已响应：输入能力不在本次范围');$('#create').onclick=openCreator;$('#upload').onclick=()=>$('#source').classList.add('show');$('#chooseCamera').onclick=camera;$('#chooseAlbum').onclick=()=>{camera();$('#album').classList.add('show')};
  $('#closeCreator').onclick=()=>{$('#creator').classList.remove('show');$('#source').classList.remove('show');$('#dim').classList.remove('show')};
  $('#closeCamera').onclick=openSource;$('#flip').onclick=()=>{facing=facing==='back'?'front':'back';camera();toast(facing==='back'?'已切换至后置摄像头':'已切换至前置摄像头')};
  $('#albumButton').onclick=()=>$('#album').classList.add('show');$('#albumClose').onclick=()=>$('#album').classList.remove('show');['#albumPhoto','#albumPhoto2','#albumPhoto3'].forEach((id,index)=>$(id).onclick=()=>{show('confirm');$('#album').classList.remove('show');toast(`已选择最近照片 ${index+1}`)});
  $('#shutter').onclick=()=>show('confirm');$('#retake').onclick=camera;$('#usePhoto').onclick=()=>{show('reviewing');setTimeout(()=>show('failed'),900)};$('#retry').onclick=openSource;$('#simulateTimeout').onclick=()=>show('serviceError');$('#retryReview').onclick=()=>{show('reviewing');setTimeout(()=>show('failed'),900)};$('#backSources').onclick=openSource;
  window.__qa={show,openSource,camera,get state(){return window.__prototypeState},get facing(){return facing}};window.__prototypeState='home';
</script></body></html>
