<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root { --blue:#0d99ff; --text:#1f1f1f; --muted:#707070; --line:#e5e5e5; --danger:#d92d20; }
    * { box-sizing:border-box; }
    body { margin:0; padding:16px; font:12px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; color:var(--text); }
    h1 { margin:0; font-size:15px; }
    .lead { margin:4px 0 14px; color:var(--muted); }
    .summary { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    #count { font-weight:600; }
    #refresh { border:0; background:none; color:var(--blue); cursor:pointer; }
    #selection { min-height:80px; max-height:240px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
    .frame { padding:9px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; }
    .frame:last-child { border-bottom:0; }
    .frame span { color:var(--muted); font-size:11px; }
    .controls { display:flex; gap:8px; margin-top:12px; }
    select { width:72px; border:1px solid var(--line); border-radius:7px; padding:8px; }
    #export { flex:1; border:0; border-radius:7px; background:var(--blue); color:white; font-weight:600; cursor:pointer; }
    #export:disabled { opacity:.45; cursor:not-allowed; }
    .status { min-height:36px; margin-top:10px; color:var(--muted); }
    .status.error { color:var(--danger); }
  </style>
</head>
<body>
  <h1>批量采集 Figma 页面</h1>
  <p class="lead">多选要参考的 Frame，一次生成一个完整任务。</p>
  <div class="summary"><span id="count">尚未选中页面</span><button id="refresh">刷新</button></div>
  <div id="selection"></div>
  <div class="controls">
    <select id="scale" aria-label="导出倍率"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select>
    <button id="export" disabled>采集所选 Frame</button>
  </div>
  <div id="status" class="status"></div>
  <script>/*__UI_BUNDLE__*/</script>
</body>
</html>
